name: Deploy to GitHub Pages

# Publishes the static site whenever main is updated.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tests must pass before anything is published — no broken deploys.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers (Chromium + WebKit/Safari engine)
        # Through the shared action: it retries and, crucially, CANNOT hang.
        # A hang here holds the `pages` concurrency group for up to 6 hours and
        # silently drops every push behind it. 85 min is a backstop above the
        # action's own worst case (3 x 25 min + backoff = 76), never the real
        # limit — and it must stay ABOVE it, or attempt 3 is killed mid-flight
        # and ATTEMPTS=3 is a lie. The old comment here said 45 while the value
        # read 70: a comment cannot go red, so check it when you move either.
        timeout-minutes: 85
        uses: ./.github/actions/install-browsers

      - name: Run tests (unit + browser e2e + mobile WebKit)
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache-bust assets with the commit SHA
        # Rewrites the __BUILD__ token -> <sha> so browsers never serve stale
        # JS/CSS, and the service worker's cache name changes each deploy.
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Validate the ACTUAL deployed site in real browsers — including WebKit
  # (Safari's engine) — so we never declare something shipped that's broken.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers (Chromium + WebKit/Safari engine)
        # Through the shared action: it retries and, crucially, CANNOT hang.
        # A hang here holds the `pages` concurrency group for up to 6 hours and
        # silently drops every push behind it. 85 min is a backstop above the
        # action's own worst case (3 x 25 min + backoff = 76), never the real
        # limit — and it must stay ABOVE it, or attempt 3 is killed mid-flight
        # and ATTEMPTS=3 is a lie. The old comment here said 45 while the value
        # read 70: a comment cannot go red, so check it when you move either.
        timeout-minutes: 85
        uses: ./.github/actions/install-browsers

      - name: Wait for the live site to serve this commit
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          if [ -z "$url" ]; then url="https://dumptruckjon.github.io/Josh-Game/"; fi
          echo "JOSH_BASE_URL=$url" >> "$GITHUB_ENV"
          sha="${GITHUB_SHA::8}"
          echo "Polling $url for ?v=$sha ..."
          for i in $(seq 1 30); do
            html="$(curl -fsSL "$url" || true)"
            if printf '%s' "$html" | grep -q "v=$sha"; then
              # The HTML being new is NOT enough. Every asset is requested with
              # ?v=<sha>, and a CDN edge can serve the new index.html while a
              # versioned script is not yet reachable there — the page then
              # boots with that script missing. That really happened: a deploy
              # went red on "the Josh tile wears his JoshArt portrait" and
              # "artFor must return an <svg>", both meaning art.js never ran,
              # on a commit that touched neither. So prove EVERY versioned
              # asset is served from this edge before trusting the site.
              missing=""
              for a in $(printf '%s' "$html" | grep -oE '(src|href)="[^"]*\?v=[^"]*"' | sed -E 's/^(src|href)="//; s/"$//'); do
                case "$a" in
                  http*) full="$a" ;;
                  /*) full="${url%/}$a" ;;
                  *) full="${url%/}/$a" ;;
                esac
                curl -fsS -o /dev/null "$full" || missing="$missing $a"
              done
              if [ -z "$missing" ]; then
                echo "Live site is serving $sha (index.html + every versioned asset)"; exit 0
              fi
              echo "attempt $i: html is $sha but these are not served yet:$missing"
            else
              echo "attempt $i: html is not $sha yet"
            fi
            sleep 10
          done
          echo "::error::Live site did not fully update to $sha within ~5 min"; exit 1

      - name: Run browser tests against the LIVE site
        run: npm test
