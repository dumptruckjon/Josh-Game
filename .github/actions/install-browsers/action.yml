name: Install Playwright browsers
description: >
  Install Chromium + WebKit (Safari's engine) from a cache where possible, and
  otherwise with a per-attempt timeout and retries, so a stalled download
  becomes a retry or a fast red — never a hang.

# WHY THIS EXISTS, and why it is ONE owner rather than a line in each job.
#
# On 2026-08-18 this step HUNG. The measured norm is 57 seconds (run #301, the
# last green one); run #304 sat on it for 92 minutes and was still going. The
# damage is not the lost time, it is that deploy.yml is `concurrency: group:
# pages, cancel-in-progress: false` — so a hung run holds the group for up to
# GitHub's 6-hour ceiling and every push behind it is dropped as `cancelled`.
# That is exactly what happened to 4c98dee and df77afc: two commits of shipped
# fixes, both reported `cancelled`, and the live site quietly kept serving
# abf31db. Nothing went red. The failure mode was SILENCE again — the same
# shape the deploy watchdog was written for, which cannot help here because it
# deliberately stops the moment a run EXISTS, hung or not.
#
# So the cure is at the source: a download that stalls is retried, and a
# download that will not come is a fast failure you can SEE. A hang is worse
# than a failure, because a failure is visible and bounded.
#
# The two jobs that need browsers (test, verify-live) both come through here,
# so the retry cannot exist in one and be missing from the other — this repo
# has paid repeatedly for the same computation living in two places.

runs:
  using: composite
  steps:
    # THE STRUCTURAL FIX, added 2026-08-19 after re-measuring the bound for the
    # third time. The install duration is not drifting upward, it is BIMODAL:
    # run #319 measured 44s and 4m05s while run #317, three hours earlier,
    # measured 17m47s and 17m39s on the same commit-shaped work. That spread is
    # the Playwright CDN having a bad day, and no value of PER_ATTEMPT makes a
    # third-party CDN reliable — it only decides how long we wait for it.
    #
    # So take the CDN off the critical path. GitHub's own cache serves the same
    # ~350MB from inside the datacentre, which is both far faster and far more
    # predictable than the mirror. On a hit `playwright install` finds the
    # browsers already present and does only the apt `--with-deps` work; on a
    # miss it downloads exactly as before, still bounded and still retried.
    #
    # MEASURED, run #323: a warm cache put one job's install at 41 SECONDS.
    # The same run's other job still took 18m38s with a cache HIT (its post
    # step saved nothing, which is what a hit looks like) — so that time was
    # entirely apt, not the download. Read that carefully before touching the
    # bound: the cache removes the CDN, and what is left to stall is apt, which
    # is exactly what both of the runs that lost a deploy were stuck in.
    #
    # The path is Playwright's DEFAULT browsers directory on Linux. That
    # matters more than it looks: caching a directory the install does not
    # actually use is a no-op that looks like a fix and reports a cache hit
    # forever, so nothing below may set PLAYWRIGHT_BROWSERS_PATH elsewhere.
    # restore-keys means a lockfile bump still restores the previous set and
    # downloads only what changed, rather than starting from nothing.
    - name: Restore the Playwright browser cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - shell: bash
      run: |
        # `set +e` FIRST, and it is the whole reason this action ever failed.
        # GitHub Actions runs `shell: bash` as `bash --noprofile --norc -eo
        # pipefail {0}` — errexit is ON — and `set -uo pipefail` does NOT clear
        # it. So the FIRST failing attempt exited the script immediately, before
        # `code=$?` was ever read: no ::warning::, no attempt 2, and the step's
        # exit code was the command's own (137 under KILL, 124 under TERM).
        # Runs #320 and #321 both died that way, on the retry that exists to
        # stop a stalled download un-shipping a commit.
        #
        # It was invisible to the behavioural guardrail for one reason: that
        # test spawned `bash script.sh`, without -e. A harness that drives the
        # shipped script TEXT is still only as faithful as its INVOCATION, and
        # it now spawns the way Actions does.
        set +e -uo pipefail
        # 25 min per attempt. RE-MEASURED THREE TIMES, which is the whole
        # lesson: a bound justified against the worst case you have SEEN needs
        # re-checking the first time you see a worse one. It shipped at 12 min
        # (~60% over a 7.5 min record), was raised to 15 when the same day
        # produced 5m45s and 10m01s, then to 20 when a healthy verify-live
        # install took 14m48s — clearing the 15 min bound by TWELVE SECONDS.
        # Then run #317 took 17m47s, which left the shipped 20 only 12% over
        # the observed worst while its own comment still claimed ~35%: the
        # justification had been refuted by the data and nobody had noticed,
        # because a comment cannot go red. 25 restores that ~40%.
        #
        # A bound running at 99% utilisation is not a bound, it is a coin flip:
        # the retry keeps it self-healing rather than red, but it still throws
        # away a download that was seconds from done and pays for it twice. The
        # only thing a generous bound costs is the worst-case hold on the
        # `pages` group (3 x 25 + backoff = 76 min, under the caller's 85), and
        # that is still a bounded, visible failure rather than a 6-hour hang.
        # Run #320 exceeded this and was killed correctly: apt went silent for
        # 24 minutes inside `--with-deps`, which is exactly the stall this
        # action exists to retry. It did not retry — see the setsid note below
        # — so that run is NOT evidence the bound is too small. Do not raise it
        # again without a run that actually made all three attempts.
        PER_ATTEMPT=1500
        ATTEMPTS=3
        BACKOFF=20

        # A KILLED ATTEMPT LEAVES apt ALIVE, AND IT BLOCKS ITS OWN RETRIES.
        # `--with-deps` runs apt under sudo, which puts it in a different
        # session — so timeout's process-group kill misses it, it keeps
        # downloading, and it keeps /var/lib/dpkg/lock-frontend. Verified in run
        # #324: attempt 1 timed out at 25 min and attempts 2 AND 3 then died in
        # ~20s each on "Could not get lock … held by process 2640 (apt-get)" —
        # the same pid both times — with apt still printing Get: lines after the
        # script had given up. So the retry was structurally correct and
        # practically useless against the one failure mode it exists for.
        #
        # -x matches the process NAME, never the full command line: `pkill -f`
        # with a pattern like 'dpkg' would match this very script's own cleanup
        # line. (That trap is not hypothetical — a `pkill -f` killed the shell
        # it was typed in earlier the same day.)
        clear_apt_locks() {
          sudo pkill -TERM -x 'apt|apt-get|dpkg|unattended-upgr' 2>/dev/null || true
          sleep 3
          sudo pkill -KILL -x 'apt|apt-get|dpkg|unattended-upgr' 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
                     /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
          # a force-killed dpkg can leave the package DB half-configured; this
          # repairs it, and the runner is ephemeral so there is nothing to lose.
          sudo dpkg --configure -a 2>/dev/null || true
        }

        for i in $(seq 1 "$ATTEMPTS"); do
          # Capture the status DIRECTLY, never as `code=$?` after an `if`:
          # a failed `if` condition with no else leaves the compound statement's
          # own status of 0, so `code` was always 0 — the HUNG branch below
          # could never fire and every failure reported "exit 0". Found by
          # running this script against a stubbed npx, not by reading it.
          # TERM with a KILL escalation rather than a bare KILL: the common case
          # shuts down cleanly, timeout still signals the whole group so a stuck
          # apt tree goes with it, and the step reports 124 (timed out) rather
          # than a bare 137 — which is the difference between "it stalled" and
          # "something killed it". Both land in the HUNG branch below.
          #
          # An earlier cut wrapped this in `setsid --wait`, on the theory that a
          # group-directed signal was killing the retry loop. That theory was
          # REFUTED by reproducing the real mechanism (errexit — see above), so
          # the wrapper is gone rather than left as a fix whose stated reason is
          # false. Never `--foreground` here, though: it leaves the command in
          # the shell's own process group, and a command that signals its group
          # then takes the loop with it — measured.
          timeout --signal=TERM --kill-after=30s "${PER_ATTEMPT}s" \
            npx playwright install --with-deps chromium webkit
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::notice::Playwright browsers installed on attempt $i"
            exit 0
          fi
          # 124 = timeout fired, 137 = it had to KILL. Either way it HUNG,
          # which is the case this whole action exists for; anything else is
          # an ordinary failure (a bad mirror, a transient 5xx) and is also
          # worth retrying, so both paths fall through to the next attempt.
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "::warning::browser install attempt $i HUNG — killed after ${PER_ATTEMPT}s"
          else
            echo "::warning::browser install attempt $i failed with exit $code"
          fi
          # Back off only if there is another attempt to make. Sleeping after
          # the LAST one just delays the red by a minute and makes the failure
          # timing read as another stall. Clear the locks FIRST, or the next
          # attempt fails in 20 seconds on a lock the killed one still holds.
          if [ "$i" -lt "$ATTEMPTS" ]; then clear_apt_locks; sleep $((i * BACKOFF)); fi
        done
        echo "::error::Playwright browser install failed $ATTEMPTS times — this is a real failure, not a hang"
        exit 1
