/* ---------- cards ---------- */
/* The word is the thing he READS, and its start size was the literal 132 — so
   it rendered at exactly the same size on a 390px phone and an 834px iPad. The
   vw track lands at or BELOW 132 at every phone width (it crosses at 471px),
   so 320 / 360 / 390 / 414 / 430 are byte-identical by construction and only a
   real tablet gains. `fit()` still shrinks a long word to fit the card. */
function wordCap(){ return Math.max(132, Math.min(Math.round(window.innerWidth * 0.28), 240)); }

function fit(el, startPx, minPx){
  const avail = card.clientWidth - 44;
  if (!avail) return;
  let size = startPx;
  el.style.fontSize = size + "px";
  let guard = 0;
  while (el.scrollWidth > avail && size > minPx && guard++ < 90){
    size -= 3; el.style.fontSize = size + "px";
  }
}

/* One CHARACTER carries far more stroke detail than a four-letter word — 蝴 has
   fifteen strokes in the space "cat" spends on three letters — so it starts
   LARGER than a word does, and fit() still shrinks it if the card is narrow. */
function hanziCap(){ return Math.min(Math.round(card.clientHeight * 0.44), Math.round(wordCap() * 1.3)); }

function render(animate){
  const c = deck[i];
  const word = c[0], backText = c[1], cat = c[2];
  const isHanzi = cat === "hanzi";

  // In the families deck the shared ending is underlined: seeing -at in cat,
  // bat, rat and hat is exactly how the pattern is taught.
  wordEl.textContent = "";
  wordEl.classList.toggle("hz", isHanzi);
  if (isHanzi) wordEl.setAttribute("lang", "zh-CN"); else wordEl.removeAttribute("lang");
  const rime = deckKind === "family" ? rimeOf(word) : "";
  const team = deckKind.indexOf("team:") === 0 ? deckKind.slice(5) : "";
  if (team){
    // Built from sounds() itself, so the mark lands on exactly the tile the
    // strip will show a moment later and never on a substring that merely
    // LOOKS like the team — anchor's c-h, mountain's a-i.
    // Runs of un-marked tiles are joined back into ONE text node rather than
    // appended one per tile: a browser may shape and kern across a text node
    // boundary differently, and "duck" must look the same here as it does in
    // every other deck.
    let plain = "";
    const flush = () => { if (plain){ wordEl.appendChild(document.createTextNode(plain)); plain = ""; } };
    for (const p of sounds(word)){
      if (p.toLowerCase() === team){
        flush();
        const b = document.createElement("span");
        b.className = "team"; b.textContent = p;
        wordEl.appendChild(b);
      } else plain += p;
    }
    flush();
  } else if (rime && word.slice(-rime.length) === rime){
    wordEl.appendChild(document.createTextNode(word.slice(0, -rime.length)));
    const b = document.createElement("span");
    b.className = "rime"; b.textContent = rime;
    wordEl.appendChild(b);
  } else {
    wordEl.textContent = word;
  }

  const isSentence = cat === "sight";
  picEl.classList.toggle("sentence", isSentence);
  picEl.classList.toggle("hz", isHanzi);
  picEl.textContent = backText;
  if (isSentence) picEl.style.fontSize = "";

  lettersEl.innerHTML = "";
  lettersEl.classList.toggle("hz", isHanzi);
  if (isHanzi){
    // The back of a hanzi card answers three different questions — how do I SAY
    // it, what does it MEAN, and what does it look like in use — so the sound
    // strip's slot carries them instead. sounds() is never called on a
    // character: it splits ENGLISH letters and would return one tile of noise.
    const line = (cls, text, zh) => {
      const el = document.createElement("span");
      el.className = cls; el.textContent = text;
      if (zh) el.setAttribute("lang", "zh-CN");
      lettersEl.appendChild(el);
    };
    line("hz__key", c[3] + " \u00b7 " + c[4]);
    line("hz__zh", c[5], true);
    line("hz__en", c[6]);
    lettersEl.style.fontSize = "";
  } else {
    const parts = sounds(word);
    for (const p of parts){
      const s = document.createElement("span");
      if (p.length > 1) s.className = "team";
      s.textContent = p;
      lettersEl.appendChild(s);
    }
  }

  fit(wordEl, isHanzi ? hanziCap() : Math.min(Math.round(card.clientHeight * 0.40), wordCap()), 26);

  // The strip is the only thing on the card that never scaled. The word derives
  // from the card's height and the picture from its width (a constant 24% at
  // every portrait size — measured, and the reason the picture is NOT touched
  // here), while these tiles were a flat 30px whether the card was 284 wide or
  // 524. They come off the card now too. 30 is the FLOOR, so every phone width
  // renders exactly as it did and only a tablet gains.
  if (!isHanzi) fit(lettersEl, Math.max(30, Math.min(Math.round(card.clientWidth * 0.08), 52)), 13);

  document.documentElement.style.setProperty("--card", COLORS[i % COLORS.length]);
  countEl.textContent = (i + 1) + " / " + deck.length;
  fillEl.style.width = ((i + 1) / deck.length * 100) + "%";
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === deck.length - 1;

  paintCardLabel();

  if (animate){ wordEl.classList.remove("pop"); void wordEl.offsetWidth; wordEl.classList.add("pop"); }
}

/* ONE owner for what the card SAYS, because three defects here were really
   one. The name was a static "Flip the card", identical before and after the
   flip — so the control this whole page exists for never said WHICH card it
   was, nor what had just happened, on a tool whose entire content is that one
   word. And `backface-visibility` hides a face from the EYE and NOT from
   assistive tech, so both faces sat in the tree at once and the card read
   "elephanttap me [picture]elephant": the ANSWER, before it was turned over.

   An explicit label REPLACES the content for the name computation, so
   everything meaningful has to be IN it (the fort's level-card precedent) —
   and the face that is turned away is aria-hidden so browse mode cannot reach
   it either. Nothing here is visual, so it costs no pixel and no contrast. */
function paintCardLabel(){
  if (!deck.length) return;
  const c = deck[i];
  const word = c[0], back = c[1], isSentence = c[2] === "sight";
  const shown = card.classList.contains("flipped");
  frontFace.setAttribute("aria-hidden", shown ? "true" : "false");
  backFace.setAttribute("aria-hidden", shown ? "false" : "true");
  if (c[2] === "hanzi"){
    // An explicit label is ONE string, so it cannot carry a lang per part —
    // a Chinese sentence inside it would be read with an English voice. So
    // the label is English throughout and the han text keeps its own lang on
    // the ELEMENTS, where VoiceOver reads it in Chinese.
    //
    // The front deliberately does not name the character: the character IS
    // the question, and its reading is the answer on the other side. It names
    // the CARD instead, so the twenty you have seen are told apart.
    card.setAttribute("aria-label", shown
      ? c[3] + ", meaning " + c[4] + ". For example: " + c[6]
        + " Tap to see the character again."
      : "Chinese character " + (i + 1) + " of " + deck.length
        + ". Tap to hear it and see what it means.");
    return;
  }
  card.setAttribute("aria-label", shown
    // Turned over, the back shows the picture (or, in the sight deck, the
    // sentence) and the sound-out tiles. The tiles are separate boxes on
    // screen and run together as text, so they are read out one at a time —
    // splitting the word is the whole point of that strip.
    ? word + ". " + (isSentence ? back + ". " : "")
      + "Sounds: " + sounds(word).join(", ") + ". Tap to see the word again."
    // The picture's own name IS the word (the deck's law: the natural
    // four-year-old name of the picture must BE the answer), so saying the
    // word covers what is about to appear without giving it away.
    : word + ". Tap to see " + (isSentence ? "a sentence." : "the picture."));
}

function unflipInstantly(){
  card.style.transition = "none";
  card.classList.remove("flipped");
  void card.offsetWidth;
  card.style.transition = "";
}

function go(step){
  const n = i + step;
  if (n < 0 || n >= deck.length) return;
  i = n; saveAt(); unflipInstantly(); render(true);
}

card.addEventListener("click", () => {
  card.classList.toggle("flipped");
  paintCardLabel();
  if (card.classList.contains("flipped")) speak.apply(null, cardSpeech(deck[i]));
});
nextBtn.addEventListener("click", () => go(1));
prevBtn.addEventListener("click", () => go(-1));

/* ONE toggle behind three screens. The only thing that differs between them is
   what there is to SAY once it is on, so that is the argument — a third copy
   of the storage write and the repaint is exactly how two of them come to
   disagree. */
function toggleSound(say){
  soundOn = !soundOn;
  try { localStorage.setItem("wc-sound", soundOn ? "1" : "0"); } catch (e) {}
  paintSound();
  if (soundOn) say();
  else try { speechSynthesis.cancel(); } catch (e) {}
}
/* The ONE other writer of the sound state: a DELIBERATE request for audio —
   tapping the word on the writing pad, or opening the listening game, whose
   question IS a sound. Sound off means "do not speak at me automatically", and
   neither of those is automatic. It turns sound on rather than speaking past
   the toggle, so the toggle always matches what the device is really doing. */
function unmute(){
  if (soundOn) return;
  soundOn = true;
  try { localStorage.setItem("wc-sound", "1"); } catch (e) {}
  paintSound();
}
soundBtn.addEventListener("click", () => toggleSound(
  () => speak.apply(null, deck.length ? cardSpeech(deck[i]) : ["hello", null])));
// Every screen shows a sound toggle and there is ONE piece of state behind
// them. Painting them here is what stops the writing pad's button saying "off"
// while the deck's says "on" — a second `soundOn` would be two owners of one
// fact. DERIVED from the page, never a list: this was `[soundBtn, $("wsound")]`
// and a third screen's toggle would simply have been forgotten.
function paintSound(){
  for (const b of document.querySelectorAll(".icon.snd")){
    b.innerHTML = soundOn ? "&#128266;" : "&#128263;";
    b.setAttribute("aria-pressed", soundOn ? "true" : "false");
    b.classList.toggle("on", soundOn);
  }
}
paintSound();

$("shuffle").addEventListener("click", () => {
  for (let k = deck.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    const t = deck[k]; deck[k] = deck[j]; deck[j] = t;
  }
  i = 0; saveAt(); unflipInstantly(); render(true);
});

/* ---------- 写字: writing practice ----------
   The flash deck teaches him to READ these 120 characters; this teaches him to
   WRITE them, and in Chinese that means stroke ORDER — taught from the first
   day of school, and a habit that has to be untaught if it is learned wrong.
   So the order is not decoration: the pad refuses a stroke drawn out of turn,
   backwards, or in the wrong place, and shows the hint again.

   No-fail, per RULE 5. A refused stroke costs nothing, and after three tries
   the pad simply writes it for him and moves on: there is no score, no timer
   and no way to get stuck.

   The data is scripts/hanzi-strokes.js — see its header for provenance and
   licence. It is authored in a 1024 box with y running UPWARD, which is what
   #wglyph's one transform handles; every coordinate here is in the DATA's
   space, so nothing flips a number by hand. */
const STROKES = window.HANZI_STROKES || {};

/* Easiest first, DERIVED from the data rather than a hand-written ladder: 一
   is one stroke and 蝴 is fifteen, so the printed table order would put a
   15-stroke character in front of a four-year-old on card ten. A tie keeps the
   table's own order, so the ladder is stable and a character cannot move
   because two of them happen to compare equal. */
function strokesOf(ch){ const d = STROKES[ch]; return d && d.s ? d.s.length : 0; }
function writeDeck(){
  return HANZI.map((row, n) => [row, n])
              .sort((a, b) => strokesOf(a[0][0]) - strokesOf(b[0][0]) || a[1] - b[1])
              .map((p) => p[0]);
}

/* A matching BOARD asks more of clash() than a deck does. A deck only needs
   NEIGHBOURS to differ; a board of four needs all SIX of its pairs to, or a
   round holds two defensible answers for one picture — 蝴 and 蝶 both mean
   butterfly and literally share 🦋, and 看 "look" beside 找 "look for" is the
   same defect one step subtler. So a round pulls from the seeded order the
   next card that clashes with nothing already on the board, which makes an
   ambiguous round unrepresentable rather than merely unlikely.

   Its OWN seed, not the flash deck's: walking the 120 in the order he reads
   them would let position do the remembering instead of the character. */
const MATCH_SIZE = 4;
function matchRounds(){
  const pool = teachingOrder(HANZI, "Match");
  const out = [];
  while (pool.length){
    const round = [];
    for (let k = 0; k < pool.length && round.length < MATCH_SIZE; k++){
      if (round.some((c) => clash(c, pool[k]))) continue;
      round.push(pool.splice(k, 1)[0]); k -= 1;
    }
    out.push(round);
  }
  return out;
}

/* How close is this finger path to that stroke? The mean distance from each
   point of the stroke's centre-line to the nearest point he drew, plus the two
   ENDPOINTS — and the endpoints are what make a stroke drawn backwards
   expensive, because direction is half of stroke order. */
function d2(a, b){ const x = a[0] - b[0], y = a[1] - b[1]; return x * x + y * y; }
function traceCost(path, med){
  if (!path.length || !med.length) return Infinity;
  let sum = 0;
  for (const m of med){
    let best = Infinity;
    for (const p of path){ const d = d2(m, p); if (d < best) best = d; }
    sum += Math.sqrt(best);
  }
  return sum / med.length +
    (Math.sqrt(d2(path[0], med[0])) + Math.sqrt(d2(path[path.length - 1], med[med.length - 1]))) / 2;
}
/* A stroke counts when it is BOTH near enough in absolute terms and a better
   match than every other stroke in the same character. That comparison is what
   makes the tolerance self-scaling — a character whose strokes crowd together
   is judged tightly and one whose strokes are far apart loosely — so there is
   no per-character constant to tune, and tracing stroke 2 while stroke 1 is
   being asked for is refused however neatly it is drawn. */
const TRACE_TOL = 210;
function judgeStroke(path, meds, want){
  const mine = traceCost(path, meds[want]);
  if (!(mine <= TRACE_TOL)) return false;
  for (let k = 0; k < meds.length; k++) if (k !== want && traceCost(path, meds[k]) < mine) return false;
  return true;
}

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const writeEl = $("write"), wpad = $("wpad"), wglyph = $("wglyph"), wghost = $("wghost"),
      wdoneEl = $("wdone"), whint = $("whint"), wtrail = $("wtrail");
let wDeck = [], wi = 0, wStep = 0, wMiss = 0, wPath = [], wPid = null, wLock = false;

function wCard(){ return wDeck[wi] || null; }
function wData(){ const c = wCard(); return c ? STROKES[c[0]] : null; }
function wSpeak(){ const c = wCard(); if (c) speak.apply(null, cardSpeech(c)); }

function wRender(){
  const c = wCard(), d = wData();
  wghost.textContent = ""; wdoneEl.textContent = ""; whint.textContent = "";
  wtrail.setAttribute("d", "");
  wpad.classList.remove("done");
  if (!c || !d) return;
  for (const p of d.s) wghost.appendChild(svgEl("path", { d: p }));
  for (let k = 0; k < wStep; k++) wdoneEl.appendChild(svgEl("path", { d: d.s[k] }));
  if (wStep < d.s.length){
    const med = d.m[wStep];
    whint.appendChild(svgEl("path", { d: d.s[wStep], class: "whintfill" }));
    whint.appendChild(svgEl("polyline", { class: "wmed", points: med.map((p) => p.join(",")).join(" ") }));
    whint.appendChild(svgEl("circle", { class: "wstart", cx: med[0][0], cy: med[0][1], r: 28 }));
  } else {
    wpad.classList.add("done");
  }
  $("wpic").textContent = c[1];
  // An explicit label REPLACES the content, so the character it will say has to
  // be IN it — the picture is aria-hidden and the pinyin alone does not name it.
  $("wsaybtn").setAttribute("aria-label", "Hear " + c[0] + ", " + c[3] + ", " + c[4]);
  $("wpy").textContent = c[3];
  $("wmean").textContent = c[4];
  $("wcount").textContent = (wi + 1) + " / " + wDeck.length;
  $("wfill").style.width = Math.max(1, Math.round(((wi + 1) / wDeck.length) * 100)) + "%";
  // An explicit label REPLACES the content for assistive tech, so everything
  // that matters has to be IN it: which character this is and how far through
  // it he is. The pad is a drawing surface, but ✍ completes a stroke on its
  // own, so there is a real path through a character without dragging at all.
  wpad.setAttribute("aria-label", c[0] + ", " + c[3] + ", " + c[4] + ". " +
    (wStep >= d.s.length ? "finished — all " + d.s.length + " strokes written."
                         : "stroke " + (wStep + 1) + " of " + d.s.length + "."));
}

function wInk(){
  const d = wData(); if (!d) return;
  wStep += 1; wMiss = 0; wPath = [];
  wRender();
  if (wStep >= d.s.length) wSpeak();
}
/* ONE owner for "write this stroke for him": the ✍ button, the three-miss
   rescue, and the only way through a character for anyone who cannot drag. */
function wShow(){
  const d = wData();
  if (!d || wLock || wStep >= d.s.length) return;
  wLock = true;
  wdoneEl.appendChild(svgEl("path", { d: d.s[wStep], class: "winkin" }));
  whint.textContent = "";
  setTimeout(() => {
    wLock = false;
    // route() only HIDES a screen, so a timer that fires after he has left
    // would ink a stroke onto a character nobody is looking at.
    if (!writeEl.classList.contains("hidden")) wInk();
  }, 420);
}
function wGo(step){
  if (!wDeck.length) return;
  wi = (wi + step + wDeck.length) % wDeck.length;
  wStep = 0; wMiss = 0; wPath = []; wPid = null; wLock = false;
  try { localStorage.setItem("wc-write-at", String(wi)); } catch (e) {}
  wRender();
  wSpeak();
}

function wPt(ev){
  const m = wglyph.getScreenCTM();
  if (!m) return null;
  const p = wpad.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  const q = p.matrixTransform(m.inverse());
  return [q.x, q.y];
}
function wPaint(){
  wtrail.setAttribute("d", wPath.length ? "M " + wPath.map((p) => p[0] + " " + p[1]).join(" L ") : "");
}
wpad.addEventListener("pointerdown", (ev) => {
  const d = wData();
  if (!d || wLock || wStep >= d.s.length) return;
  if (wPid !== null) return;   // multi-touch forgiveness: the first finger decides
  const pt = wPt(ev); if (!pt) return;
  wPid = ev.pointerId;
  try { wpad.setPointerCapture(wPid); } catch (e) {}
  wPath = [pt]; wPaint();
  ev.preventDefault();
});
wpad.addEventListener("pointermove", (ev) => {
  if (wPid === null || ev.pointerId !== wPid) return;
  const pt = wPt(ev); if (!pt) return;
  const last = wPath[wPath.length - 1];
  // ~20 units of a 1024 box. Fine enough to follow a curve, coarse enough that
  // scoring stays cheap on a 15-stroke character.
  if (last && d2(last, pt) < 400) return;
  wPath.push(pt); wPaint();
});
function wEnd(ev){
  if (wPid === null || ev.pointerId !== wPid) return;
  try { wpad.releasePointerCapture(wPid); } catch (e) {}
  wPid = null;
  const d = wData();
  const path = wPath; wPath = []; wPaint();
  if (!d || wStep >= d.s.length) return;
  if (judgeStroke(path, d.m, wStep)){ wInk(); return; }
  wMiss += 1;
  wpad.classList.remove("nudge");
  wpad.getBoundingClientRect();          // restart the nudge on a doubled miss
  wpad.classList.add("nudge");
  setTimeout(() => wpad.classList.remove("nudge"), 420);
  if (wMiss >= 3) wShow();
}
wpad.addEventListener("pointerup", wEnd);
wpad.addEventListener("pointercancel", wEnd);

$("wshow").addEventListener("click", wShow);
// Sound OFF means "do not speak at me automatically", and a tap on the word is
// not automatic — it is the one unambiguous request for audio on the screen. So
// it turns sound on rather than refusing: a control that silently does nothing
// is indistinguishable from a broken one to a four-year-old, and this way the
// toggle in the bar always matches what the device is actually doing. It says
// it through wSpeak/cardSpeech like every other speech on the page, so the
// character, its sentence and its LANGUAGE cannot drift from the flash deck's.
$("wsaybtn").addEventListener("click", () => { unmute(); wSpeak(); });
$("wnext").addEventListener("click", () => wGo(1));
$("wprev").addEventListener("click", () => wGo(-1));
$("wsound").addEventListener("click", () => toggleSound(wSpeak));
$("wback").addEventListener("click", () => {
  writeEl.classList.add("hidden");
  menu.classList.remove("hidden");
  try { speechSynthesis.cancel(); } catch (e) {}
});
$("writeBtn").querySelector("small").textContent = HANZI.length + " characters";
$("writeBtn").addEventListener("click", () => {
  wDeck = writeDeck();
  // Same reasoning as the flash deck: a stable order is only worth having if
  // you can carry on from where you stopped. The BOUND is not the deck's,
  // though, and what decides it is the NAV. go() is CLAMPED, so the flash
  // deck's last card is terminal — a dead Next button — and its `< n - 1` is a
  // deliberate wrap-to-the-start. wGo() is MODULAR, so every index here is a
  // playable index and the last character is simply the last one he can be
  // parked on; with the deck's bound, coming back to it silently started him
  // over at the first. This is the board's rule for the board's reason, and
  // harmonising the three onto one number would break whichever two did not
  // get it.
  wi = 0;
  try {
    const v = parseInt(localStorage.getItem("wc-write-at"), 10);
    if (v >= 0 && v < wDeck.length) wi = v;
  } catch (e) {}
  wStep = 0; wMiss = 0; wPath = []; wPid = null; wLock = false;
  menu.classList.add("hidden");
  writeEl.classList.remove("hidden");
  wRender();
});

/* ---------- 配对: match the character to its picture ----------
   The pictures are the flash deck's OWN, so this mode teaches nothing new: it
   asks him to recall a pairing he has already met. That is what makes an
   abstract character fair game here — 了 🏁 and 的 🔗 picture their sentence
   rather than themselves, and on a board that is the same cue it was on the
   card rather than a riddle.

   Either side may be picked first. A four-year-old reaches for whatever
   catches his eye, and refusing one direction would be a failure state in a
   game RULE 5 does not allow to have one. */
const matchEl = $("match"), mcharsEl = $("mchars"), mpicsEl = $("mpics");
let mRounds = [], mr = 0, mHeld = null, mMiss = 0, mDone = 0, mLock = false;

function mDeck(){ if (!mRounds.length) mRounds = matchRounds(); return mRounds; }
function mRound(){ return mRounds[mr] || []; }
function mCard(ch){ return mRound().find((c) => c[0] === ch) || null; }
function mSay(ch){ const c = mCard(ch); if (c) speak.apply(null, cardSpeech(c)); }
function mSayHeld(){ mSay(mHeld ? mHeld.dataset.ch : (mRound()[0] || [])[0]); }

/* The right-hand column is a DERANGEMENT of the left, not merely a shuffle:
   with four tiles a plain shuffle leaves a pair on its own row about 37% of
   the time and lines the whole board up 1 time in 24, either of which lets
   POSITION answer the question instead of the character. Seeded, so the board
   he comes back to is the board he left. */
function mPicOrder(round, seed){
  const r = rngFrom(seedOf(seed)), out = round.slice();
  for (let guard = 0; guard < 60; guard++){
    for (let k = out.length - 1; k > 0; k--){
      const j = Math.floor(r() * (k + 1)); const t = out[k]; out[k] = out[j]; out[j] = t;
    }
    if (out.every((c, k) => c !== round[k])) break;
  }
  return out;
}

/* A picture tile is labelled with its card's MEANING — and the PARENTHETICAL
   has to go, which is not tidying. 14 of the 120 gloss themselves with the word
   they live in (阳 "sun (太阳)", 什 "what (什么)", 蝶 "butterfly (蝴蝶)"), so the
   raw meaning would hand a screen-reader user the very character the tile
   matches: this page's own "the answer stays off the tree" law, lost on a new
   screen exactly the way it gets lost. Three meanings are entirely parenthetical
   (只, 了, 个) and keep their full text, none of which names its own character. */
function mMeaning(c){
  const t = c[4].replace(/\s*\([^)]*\)/g, "").trim();
  return t || c[4];
}

function mTile(side, c){
  const b = document.createElement("button");
  b.className = "mtile"; b.type = "button";
  b.dataset.ch = c[0]; b.dataset.side = side;
  const sp = document.createElement("span");
  if (side === "char"){
    // No explicit label: the character IS the name, and lang="zh-CN" is what
    // gives VoiceOver a Chinese voice on it. A label would REPLACE it.
    sp.className = "mchar"; sp.lang = "zh-CN"; sp.textContent = c[0];
  } else {
    // The picture is the ANSWER channel, so it has to reach a screen reader as
    // words — an emoji's announced name is a platform detail, while the
    // meaning is the card's own and is what the deck already taught.
    sp.className = "mpic"; sp.textContent = c[1]; sp.setAttribute("aria-hidden", "true");
    b.setAttribute("aria-label", mMeaning(c));
  }
  b.appendChild(sp);
  return b;
}

function mRender(){
  const round = mRound();
  mcharsEl.textContent = ""; mpicsEl.textContent = "";
  mHeld = null; mMiss = 0; mDone = 0;
  for (const c of round) mcharsEl.appendChild(mTile("char", c));
  for (const c of mPicOrder(round, "pic" + mr)) mpicsEl.appendChild(mTile("pic", c));
  $("mcount").textContent = (mr + 1) + " / " + mRounds.length;
  $("mfill").style.width = Math.max(1, Math.round(((mr + 1) / mRounds.length) * 100)) + "%";
}

function mPick(b){
  if (mHeld){ mHeld.classList.remove("held"); mHeld.setAttribute("aria-pressed", "false"); }
  mHeld = b; mMiss = 0;
  b.classList.add("held"); b.setAttribute("aria-pressed", "true");
  if (b.dataset.side === "char") mSay(b.dataset.ch);
}
function mPair(a, b){
  for (const el of [a, b]){
    el.classList.remove("held"); el.classList.add("done");
    el.setAttribute("aria-disabled", "true");
    el.removeAttribute("aria-pressed");
  }
  mHeld = null; mMiss = 0; mDone += 1;
  mSay(a.dataset.ch);
  if (mDone >= mRound().length) mFinish();
}
/* Three misses and the board shows him — the 写字 rescue, one screen over.
   Nothing is removed, nothing is scored, and the pick survives: the only thing
   a wrong tap costs is the tap. */
function mBump(b){
  nudge(b);
  mMiss += 1;
  if (mMiss < 3 || !mHeld) return;
  const other = mHeld.dataset.side === "char" ? mpicsEl : mcharsEl;
  const t = other.querySelector('[data-ch="' + mHeld.dataset.ch + '"]');
  if (t) glow(t);
}
/* ONE owner for the two no-fail cues both boards use — a wrong tap WIGGLES the
   tile it hit, and the rescue GLOWS the right one — so their timing and their
   classes (which the reduced-motion block switches off) cannot drift apart
   between the matching board and the listening one. */
function nudge(el){
  el.classList.remove("miss"); void el.offsetWidth; el.classList.add("miss");
  setTimeout(() => el.classList.remove("miss"), 420);
}
function glow(el){
  el.classList.remove("hintme"); void el.offsetWidth; el.classList.add("hintme");
  setTimeout(() => el.classList.remove("hintme"), 1900);
}
function mTap(b){
  if (mLock || b.getAttribute("aria-disabled") === "true") return;
  // A doubled tap KEEPS the hold rather than cancelling it — a hammer-tapping
  // four-year-old must never undo his own pick. Switching is tapping a
  // DIFFERENT tile, which the same branch already does.
  if (!mHeld || mHeld.dataset.side === b.dataset.side){ mPick(b); return; }
  if (mHeld.dataset.ch === b.dataset.ch) mPair(mHeld, b);
  else mBump(b);
}
function mFinish(){
  mLock = true;
  setTimeout(() => {
    mLock = false;
    // route() only HIDES a screen, so a timer that fires after he has left
    // would deal a fresh board onto a screen nobody is looking at.
    if (matchEl.classList.contains("hidden")) return;
    mGo(1);
  }, 950);
}
/* A HOLD, not a tap — see the CSS above for why. The two sibling screens each
   carry a ◀ ▶ nav and this one cannot: four rows at the tap floor already fill
   a 320x480 screen to within 2px, so there is no room for a nav row, and
   without one the ONLY way off round 17 was to clear thirteen more boards.
   That is the defect this fixes; the gate is what keeps the cure from becoming
   a way to never leave round 1.

   A keyboard is not a four-year-old's finger, so Enter and Space act at once —
   a hold-only control would be operable by touch and mouse and by nothing
   else. */
const HOLD_MS = 800;
/* ONE owner for the gate, because the listening game needs the same one and a
   second copy of four listeners is how two gates come to disagree — one still
   firing when the finger slides off, say. */
function holdToAct(btn, act){
  let t = null;
  const stop = () => { if (t) clearTimeout(t); t = null; btn.classList.remove("holding"); };
  btn.addEventListener("pointerdown", () => {
    if (t) return;
    btn.classList.add("holding");
    t = setTimeout(() => { stop(); act(); }, HOLD_MS);
  });
  // pointerleave as well as up/cancel: holding and then sliding OFF the button
  // is how a grown-up changes their mind, and it must not still fire.
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) btn.addEventListener(ev, stop);
  btn.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    ev.preventDefault();
    act();
  });
}
function mRestart(){
  if (!mRounds.length) return;
  mr = 0; mLock = false;
  // REMOVED, not set to "0": the loader already defaults to the first round, so
  // a stored zero would be a second way of saying the same thing.
  try { localStorage.removeItem("wc-match-at"); } catch (e) {}
  mRender();
}

function mGo(step){
  if (!mRounds.length) return;
  mr = (mr + step + mRounds.length) % mRounds.length;
  try { localStorage.setItem("wc-match-at", String(mr)); } catch (e) {}
  mRender();
}
for (const col of [mcharsEl, mpicsEl]){
  col.addEventListener("click", (ev) => {
    const b = ev.target.closest(".mtile");
    if (b) mTap(b);
  });
}
$("msound").addEventListener("click", () => toggleSound(mSayHeld));
holdToAct($("mreset"), mRestart);
$("mback").addEventListener("click", () => {
  matchEl.classList.add("hidden");
  menu.classList.remove("hidden");
  try { speechSynthesis.cancel(); } catch (e) {}
});
$("matchBtn").querySelector("small").textContent = mDeck().length + " rounds";
$("matchBtn").addEventListener("click", () => {
  mDeck();
  // Same reasoning as the other two modes: a stable order is only worth having
  // if you can carry on from where you stopped.
  mr = 0;
  try {
    const v = parseInt(localStorage.getItem("wc-match-at"), 10);
    if (v >= 0 && v < mRounds.length) mr = v;
  } catch (e) {}
  mLock = false;
  menu.classList.add("hidden");
  matchEl.classList.remove("hidden");
  mRender();
});

/* ---------- 👂 Hear it, find it: the screen ----------
   The rules for what goes on a board live with the other deck derivations,
   above — they read no DOM, so a test can deal every round in node. */
const hearEl = $("hear"), hsay = $("hsay"), hcue = $("hcue"), hchoices = $("hchoices");
const HEAR_BEAT = 1500;
let hDeck = [], hi = 0, hMiss = 0, hSolved = false, hCued = false, hTimer = 0;

function hDeckOnce(){ if (!hDeck.length) hDeck = hearDeck(); return hDeck; }
function hCard(){ return hDeck[hi] || null; }
function hSpeak(){ const c = hCard(); if (c) speak.apply(null, cardSpeech(c)); }
function hSaveAt(n){ try { localStorage.setItem("wc-hear-at", String(n)); } catch (e) {} }

/* The prompt tile. Unsolved and audible, it is only the say-it glyph — the
   question is the sound. Silent (sound off, or no voice on the device), it
   shows the picture, or for a sight word its sentence with a blank where the
   word goes. Solved, it shows the answer: the picture, or the whole sentence
   with the word marked the way the families deck marks an ending. */
function hPaintCue(){
  const c = hCard(); if (!c) return;
  const show = hSolved || hCued;
  hsay.classList.toggle("cued", show);
  hcue.classList.toggle("hidden", !show);
  hcue.classList.toggle("sentence", c[2] === "sight");
  hcue.textContent = "";
  if (c[2] === "sight"){
    c[1].split(" ").forEach((p, k) => {
      if (k) hcue.appendChild(document.createTextNode(" "));
      if (p.toLowerCase() !== c[0].toLowerCase()){ hcue.appendChild(document.createTextNode(p)); return; }
      const b = document.createElement("span");
      b.className = hSolved ? "hmark" : "hblank";
      b.textContent = hSolved ? p : " ";
      hcue.appendChild(b);
    });
  } else {
    hcue.textContent = c[1];
  }
  // The label never names the word before he has found it: a screen reader
  // reading it out would answer the question for him.
  hsay.setAttribute("aria-label", hSolved ? c[0] + ". Hear it again." : "Hear the word again");
  hFit();
}
/* The tile's height is whatever the screen has left after the words, so the
   picture and the big say-it glyph are sized from its REAL box. A sentence is
   text and keeps its CSS size. */
function hFit(){
  if (hearEl.classList.contains("hidden")) return;
  const box = Math.min(hsay.clientWidth, hsay.clientHeight) - 28;
  if (box <= 0) return;
  const glyph = hsay.querySelector(".wear");
  glyph.style.fontSize = hsay.classList.contains("cued") ? "" : Math.round(Math.max(36, Math.min(box * 0.62, 160))) + "px";
  hcue.style.fontSize = hcue.classList.contains("sentence") ? "" : Math.round(Math.max(40, Math.min(box * 0.72, 240))) + "px";
}

function hRender(){
  const c = hCard(); if (!c) return;
  clearTimeout(hTimer); hTimer = 0;
  hMiss = 0; hSolved = false;
  // Decided per ROUND, so turning sound on halfway through a word does not
  // snatch away a picture he is already using.
  hCued = !soundOn || !window.speechSynthesis;
  document.documentElement.style.setProperty("--card", COLORS[hi % COLORS.length]);
  hchoices.textContent = "";
  for (const w of hearChoices(c[0])){
    const b = document.createElement("button");
    b.type = "button"; b.className = "mtile"; b.dataset.word = w;
    if (w === c[0]) b.dataset.correct = "1";
    const sp = document.createElement("span");
    sp.className = "hword"; sp.textContent = w;
    b.appendChild(sp);
    hchoices.appendChild(b);
  }
  hPaintCue();
  $("hcount").textContent = (hi + 1) + " / " + hDeck.length;
  $("hfill").style.width = Math.max(1, Math.round(((hi + 1) / hDeck.length) * 100)) + "%";
}

function hSolve(b){
  hSolved = true;
  b.classList.add("done");
  // An answered board answers nothing: no "try again" can follow a right
  // answer, and no flag is left up for anything to find twice.
  for (const x of hchoices.children){ x.setAttribute("aria-disabled", "true"); delete x.dataset.correct; }
  hPaintCue();
  hcue.classList.remove("pop"); void hcue.offsetWidth; hcue.classList.add("pop");
  hSpeak();
  // The NEXT word is saved now, not when the beat ends: leaving during the
  // beat must not bring him back to a word he has already found.
  hSaveAt((hi + 1) % hDeck.length);
  hTimer = setTimeout(() => {
    hTimer = 0;
    // A screen here is only HIDDEN when he leaves, so a timer that fired after
    // that would deal a word onto a screen nobody is looking at.
    if (!hearEl.classList.contains("hidden")) hGo(1);
  }, HEAR_BEAT);
}
function hTap(b){
  if (hSolved || b.getAttribute("aria-disabled") === "true") return;
  const c = hCard(); if (!c) return;
  if (b.dataset.word === c[0]){ hSolve(b); return; }
  nudge(b);
  hSpeak();   // the word again, so he can compare what he heard with what he read
  hMiss += 1;
  if (hMiss >= 3){
    const t = hchoices.querySelector('[data-word="' + c[0] + '"]');
    if (t) glow(t);
  }
}
/* Modular, like 写字 and 配对: every index is a real word, so finishing the
   last one simply starts the ladder again. */
function hGo(step){
  if (!hDeck.length) return;
  hi = (hi + step + hDeck.length) % hDeck.length;
  hSaveAt(hi);
  hRender();
  hSpeak();
}
function hRestart(){
  if (!hDeck.length) return;
  hi = 0;
  // REMOVED, not set to "0", exactly as 配对 does it.
  try { localStorage.removeItem("wc-hear-at"); } catch (e) {}
  hRender();
  hSpeak();
}

hchoices.addEventListener("click", (ev) => {
  const b = ev.target.closest(".mtile");
  if (b) hTap(b);
});
hsay.addEventListener("click", () => { unmute(); hSpeak(); });
$("hsound").addEventListener("click", () => {
  toggleSound(hSpeak);
  // Silenced halfway through a word: show him the picture instead.
  if (!soundOn) hCued = true;
  hPaintCue();
});
holdToAct($("hreset"), hRestart);
$("hback").addEventListener("click", () => {
  clearTimeout(hTimer); hTimer = 0;
  hearEl.classList.add("hidden");
  menu.classList.remove("hidden");
  try { speechSynthesis.cancel(); } catch (e) {}
});
$("hearBtn").querySelector("small").textContent = hDeckOnce().length + " words";
$("hearBtn").addEventListener("click", () => {
  hDeckOnce();
  // The bound is the modular one, as on the other two boards: the last word is
  // a real place to stop, and coming back must land on it, not on the first.
  hi = 0;
  try {
    const v = parseInt(localStorage.getItem("wc-hear-at"), 10);
    if (v >= 0 && v < hDeck.length) hi = v;
  } catch (e) {}
  // A listening game IS a request for sound — see unmute().
  unmute();
  menu.classList.add("hidden");
  hearEl.classList.remove("hidden");
  hRender();
  hSpeak();
});

document.addEventListener("keydown", e => {
  if (!writeEl.classList.contains("hidden")){
    if (e.key === "ArrowRight") wGo(1);
    if (e.key === "ArrowLeft")  wGo(-1);
    return;
  }
  if (deckEl.classList.contains("hidden")) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft")  go(-1);
});

let startX = null;
deckEl.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
deckEl.addEventListener("touchend", e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
  startX = null;
}, {passive:true});

window.addEventListener("resize", () => { if (deck.length) render(false); hFit(); });
</script>
</body>
</html>
