<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Cards</title>
<style>
  :root{ --ground:#1B1035; --ink:#21123F; --card:#FFC93C; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* iOS touch hygiene — the same page-wide rule styles/main.css carries, which
     this standalone page does not load. `touch-action` INTERSECTS down the
     ancestor chain, so declaring it once on the root stops the ACCIDENTAL
     double-tap zoom everywhere (reported from real play) while leaving panning
     AND pinch-zoom alone — never `user-scalable=no`, which bans zooming.
     `overscroll-behavior` is the other half: it stops the rubber-band bounce and
     pull-to-refresh, which on a flash-card deck RELOADS the page and loses your
     place. Honest floor: Safari added it in 16, so Josh's iOS 14.2 iPad ignores
     it — it is the whole fix everywhere else and regresses nothing there. */
  html,body{height:100%;margin:0;
    touch-action:manipulation;overscroll-behavior:none;-webkit-overflow-scrolling:touch;}
  body{
    background:var(--ground);
    font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Nunito,Verdana,system-ui,sans-serif;
    display:flex;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .wrap{width:100%;max-width:560px;height:100%;min-height:100vh;min-height:100dvh;
        padding:calc(env(safe-area-inset-top, 0px) + 18px)
                calc(env(safe-area-inset-right, 0px) + 18px)
                calc(env(safe-area-inset-bottom, 0px) + 26px)
                calc(env(safe-area-inset-left, 0px) + 18px);
        display:grid;grid-template-columns:minmax(0,100%);gap:16px;}
  #deck{grid-template-rows:auto auto 1fr auto;}
  /* Above 600px the 560 cap stops being a sensible ceiling and becomes a tax.
     Measured: the card holds 89-91% of the width on every phone and falls to
     68 / 63 / 51% at 768 / 834 / 1024, while its CONTENTS stay frozen — the
     word is exactly 132px on a 390 phone AND on an 834 iPad, and the picture
     is pinned to its 8rem cap. That is "a tablet must never be stingier than a
     phone" on the one page no audit reaches.
     The MENU keeps 560 deliberately: its chips already measure 255px there,
     and 14 categories only fill EVENLY at two columns (3 and 4 both orphan a
     card), so widening it would buy a ragged grid and nothing else.

     UNCONDITIONAL, not wrapped in a `min-width` query. `#deck` outranks
     `.wrap` on specificity and a `max-width` can only ever cap, never expand,
     so with the wrap at `width: 100%` a query around this changes nothing at
     any width — measured byte-identical at 320 / 360 / 390 / 414 / 600 / 768 /
     834 / 1024. The first cut DID carry one, and a mutation that moved its
     breakpoint to 360px passed, which is what sent me to check; a line whose
     removal changes nothing makes its own guardrail unfalsifiable. */
  #deck{max-width:820px;}
  #menu{grid-auto-rows:min-content;align-content:start;}
  .hidden{display:none !important;}

  /* ---------- menu ---------- */
  #menu{overflow-y:auto;overscroll-behavior:contain;}
  .title{color:#fff;font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:.01em;}
  .sub{color:rgba(255,255,255,.5);font-size:16px;font-weight:600;margin-bottom:18px;}
  .all, .mode{
    /* 76px, not the 70px this shipped at: RULE 5 wants >= 75px for little
       hands, and nothing audited the MENU's taps — only the deck's. */
    width:100%;min-height:76px;border:0;border-radius:26px;background:#fff;color:var(--ink);
    padding:22px;font-family:inherit;font-size:23px;font-weight:800;cursor:pointer;
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
    box-shadow:0 10px 0 rgba(0,0,0,.22);margin-bottom:20px;
  }
  /* No dimming on a light fill. Dark ink on this card's eight hues is only
     5.01:1 at its WORST, so there is no headroom to spend: measured, even
     opacity .90 breaches AA (4.39) and only full ink clears it on all eight.
     These counts were .5 and .55 — 3.35:1 on white and 2.46:1 on purple.
     Hierarchy comes from SIZE and WEIGHT instead, which it already did. */
  .all small,.mode small{font-size:16px;font-weight:700;}
  .all:active,.mode:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(0,0,0,.22);}
  /* 16px, not the 12px this shipped at: RULE 5's spacing law is >= 16px
     between tap targets, and the menu's chips are the most-tapped targets on
     the page. Its taps were audited for SIZE and never for SPACING — the same
     hole the 76px comment above records for size. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:20px;}
  .chip{
    border:0;border-radius:22px;padding:16px 14px;cursor:pointer;font-family:inherit;
    color:var(--ink);text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.22);
    display:grid;grid-template-columns:minmax(0,100%);gap:4px;
  }
  .chip .ic{font-size:30px;line-height:1;}
  .chip .nm{font-size:18px;font-weight:800;line-height:1.15;}
  .chip .ct{font-size:14px;font-weight:700;}
  /* A letter-team chip's "icon" is the TEAM itself — the thing he is learning
     to recognise — so it is set in the page's own face rather than an emoji,
     and a little larger, because two or three letters carry less ink than a
     glyph does. It stays aria-hidden like every other chip icon; the team is
     spoken by the chip's own label instead. */
  .chip.team .ic{font-size:34px;font-weight:900;letter-spacing:.03em;}
  .chip:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.22);}
  .chip:focus-visible,.all:focus-visible,.mode:focus-visible{outline:4px solid #fff;outline-offset:3px;}
  /* The wider gap takes 2px off each chip, and at 320px "Describing" (the
     longest word on any chip) then ran 2.3px past the chip's text box. It was
     already 0.3px over at the old gap. On a phone narrower than 360px the
     chip's side padding gives way instead of the word: 10px leaves it 5.7px to
     spare. Every wider screen is unchanged. */
  @media (max-width:359px){ .chip{padding-left:10px;padding-right:10px;} }

  .mhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;}
  .home{
    width:76px;height:76px;border:0;border-radius:99px;background:rgba(255,255,255,.13);
    color:#fff;font-size:32px;line-height:1;text-decoration:none;
    display:grid;place-items:center;
  }
  .home:active{transform:scale(.92);}
  .home:focus-visible{outline:4px solid #fff;outline-offset:3px;}

  /* ---------- deck ---------- */
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;}
  .back{
    min-width:0;min-height:76px;border:0;border-radius:99px;background:rgba(255,255,255,.13);
    color:#fff;font-family:inherit;font-size:16px;font-weight:800;padding:11px 18px;
    cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .back:active{transform:scale(.97);}
  .icon{width:76px;height:76px;border:0;border-radius:99px;
    background:rgba(255,255,255,.13);color:#fff;font-size:19px;cursor:pointer;line-height:1;
    font-family:inherit;}
  .icon:active{transform:scale(.92);}
  /* the sound toggle is a STATE, so it reads as on at a glance, not just in
     its label — off by default (RULE 5) and remembered between visits. */
  .icon.on{background:#FFC93C;color:#21123F;}
  .back:focus-visible,.icon:focus-visible,.nav button:focus-visible{outline:3px solid #fff;outline-offset:3px;}

  .meter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;}
  .track{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;}
  .fill{height:100%;width:1%;border-radius:99px;background:var(--card);
        transition:width .35s cubic-bezier(.2,.8,.25,1),background .35s ease;}
  .count{color:rgba(255,255,255,.55);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}

  .scene{flex:1;min-height:230px;perspective:1400px;}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
        transition:transform .5s cubic-bezier(.2,.85,.25,1);
        cursor:pointer;border:0;padding:0;background:none;display:block;}
  .card.flipped{transform:rotateY(180deg);}
  .card:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:34px;}
  .face{position:absolute;top:0;right:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        border-radius:34px;background:var(--card);overflow:hidden;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        box-shadow:0 16px 0 rgba(0,0,0,.22);transition:background .35s ease;}
  .back-face{transform:rotateY(180deg);}
  .word{font-size:64px;font-weight:800;color:var(--ink);letter-spacing:.02em;line-height:1;white-space:nowrap;}
  /* 1.95..2.49:1 at .42 — the one instruction on the front of a card, and the
     faintest thing on it. Full ink is 15px against the word's 64px, so the
     hierarchy is a 4x size step and needs no dimming to carry it. */
  .hint{position:absolute;bottom:24px;color:var(--ink);font-size:15px;font-weight:700;}
  /* 12rem, not 8: at 8rem the picture CAPPED from 600px up (128px on every
     tablet) while `22vmin` wanted 169-192. Phones never reach either cap —
     their 22vmin is 70-91px — so they are byte-identical by construction. */
  .pic{font-size:clamp(3.6rem,22vmin,12rem);line-height:1;}
  /* The SIBLING of the cap above, and it had the identical defect — raising one
     and leaving the other is the fix-it-where-you-found-it class. At 2.6rem the
     sight-word sentence CAPPED from ~600px up, so it went the wrong way against
     the card: 60% of its width on a 390 phone and 41% on an 834 tablet. 3.9rem
     is where a tablet lands back on the phone's own proportion (57 / 58 / 62%
     at 768 / 834 / 1024); phones are byte-identical, because 7vmin (24-29px)
     decides there and never reaches either cap. */
  .pic.sentence{font-size:clamp(1.5rem,7vmin,3.9rem);font-weight:800;color:var(--ink);
                line-height:1.35;max-width:82%;text-align:center;}
  .letters{margin-top:20px;display:flex;justify-content:center;font-size:26px;font-weight:800;
           color:rgba(33,18,63,.7);white-space:nowrap;}
  .letters span{padding:0 .22em;}
  /* a two-letter SOUND is one tile, not two letters: sh-i-p, never s-h-i-p.
     Spacing is a child margin, never a flex `gap` — Safari 14 drops gap in a
     flex row and every tile would touch on Josh's iPad.

     The plate is WHITE, not ink. A dark plate under already-dark ink darkens
     the background it sits on, so the highlighted tile came out FAINTER than
     its plain siblings — 2.78:1 on the purple card against their 3.18..5.33,
     below even the 3.0 large-text bar, on sh/ch/th, which is his working
     edge. A highlight must be the clearest mark on the strip, not the
     faintest. .55 is one step past the measured crossover (.50) at which a
     white plate becomes as visible against the card as the ink one it
     replaces; at .55 the tile reads 4.93..5.92 and the plate 1.26..2.04. */
  .letters span.team{background:rgba(255,255,255,.55);border-radius:.3em;
                     padding:0 .16em;margin:0 .06em;}
  /* the shared ending in the families deck. An underline rather than a colour:
     the card background cycles through eight hues and a second ink colour
     could not stay above AA contrast on all of them. */
  .word .rime,.hmark{border-bottom:.09em solid rgba(33,18,63,.45);padding-bottom:.02em;}
  /* In a letter-team deck the team is marked on the FRONT as well, on the same
     white plate the sound strip gives a team tile — so "bucket" shows him the
     ck before he flips, and the two surfaces mark the same letters the same
     way. Full-strength ink on a .55 plate, where the strip already measures
     4.93..5.92 on these eight card colours at .7 ink. */
  .word .team{background:rgba(255,255,255,.55);border-radius:.18em;padding:0 .05em;}
  /* ---------- 中文 ----------
     The font stack is the load-bearing line here, not the sizes. This page's
     own family opens `ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic
     ProN"` — and Hiragino Maru Gothic is a JAPANESE face sitting BEFORE
     system-ui, so every han codepoint it covers would render in Japanese
     forms (花, 海, 直 and 兔 all differ) while the simplified-only ones it does
     not cover — 车 门 鸟 马 红 绿 蓝 们 — fell through it to whatever came
     after. Simplified Chinese has to be asked for BY NAME; iOS answers with
     PingFang SC. Everything that paints a han character carries this face and
     a lang="zh-CN", which is also what gives VoiceOver a Chinese voice on it. */
  :root{ --hz-face:"PingFang SC","Hiragino Sans GB","Heiti SC","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; }
  .word.hz,.hz__zh,.mchar,.all.hz b,.mode.hz b{font-family:var(--hz-face);}
  .all.hz,.mode.hz{background:#FF5A5A;}
  /* The back of a hanzi card is THREE runs, not one picture, so the cue shrinks
     to leave them room — and every run is FULL ink. The .7 the sound strip uses
     is only safe because that strip is LARGE text (bar 3.0); these are not, so
     they take the 4.5 bar, where dark ink on this card's eight hues measures
     5.01:1 at its worst and has nothing left to dim. Hierarchy is size and
     weight, exactly as it is on the front. */
  .pic.hz{font-size:clamp(3.2rem,20vmin,10rem);}
  .letters.hz{display:grid;grid-template-columns:minmax(0,100%);gap:.3em;
              justify-items:center;white-space:normal;text-align:center;
              max-width:88%;margin-top:16px;color:var(--ink);}
  .hz__key{font-size:clamp(1.15rem,5.6vmin,2.6rem);font-weight:800;}
  .hz__zh {font-size:clamp(1.4rem,7vmin,3.4rem);font-weight:800;line-height:1.35;}
  .hz__en {font-size:clamp(.95rem,4.2vmin,2rem);font-weight:700;line-height:1.3;}
  .sect{color:rgba(255,255,255,.62);font-size:14px;font-weight:800;
        letter-spacing:.12em;text-transform:uppercase;margin:2px 0 12px;}
  .pop{animation:pop .32s cubic-bezier(.2,.9,.3,1);}
  @keyframes pop{from{transform:scale(.9) translateY(10px);opacity:.3}to{transform:none;opacity:1}}

  /* grid-auto-flow, not a two-track template: the 中文 cards put an English
     speaker BETWEEN ◀ and ▶, and `auto auto` would wrap a third button onto a
     row of its own. A hidden button makes no track at all, so every other
     deck and 写字's nav lay out exactly as before. */
  .nav{display:grid;grid-auto-flow:column;justify-content:center;gap:22px;}
  .nav button{width:76px;height:76px;border-radius:99px;border:3px solid rgba(255,255,255,.28);
    background:transparent;color:#fff;font-size:33px;line-height:1;padding-bottom:5px;cursor:pointer;
    transition:transform .12s ease,background .2s ease;}
  .nav button:active{transform:scale(.9);background:rgba(255,255,255,.12);}
  .nav button:disabled{opacity:.25;}
  /* The 中文 cards' English speaker (owner, 2026-09: "he can't even read
     English yet by himself"). It is 新字's own 🇺🇸 card, so it means the same
     thing wherever he meets it, and white so it never reads as ◀ or ▶. It sits
     between them rather than in the bar, because the bar is back + two 76px
     icons and a third leaves the back button under the 75px floor at 320.
     84 wide: 76 + 22 + 84 + 22 + 76 = 280 is what a 284px row holds at 320.
     Everything that differs from a nav button is re-declared, or `.nav button`
     would draw it as a 76px outlined circle — :active included, whose
     translucent fill would otherwise turn the white card see-through. */
  .nav .nsay{width:84px;height:76px;padding:0;border:0;border-radius:26px;background:#fff;
             color:var(--ink);font-family:inherit;display:grid;justify-items:center;
             align-content:center;gap:2px;box-shadow:0 8px 0 rgba(0,0,0,.22);}
  .nav .nsay .wear{font-size:34px;}
  .nsayn{font-size:13px;font-weight:800;}
  .nav .nsay:active{background:#fff;transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.22);}

  /* ---------- 写字: the writing pad ----------
     A third screen rather than a third face of the card: writing is a
     different task from reading and wants the whole viewport. It borrows the
     deck's own bar, meter and nav, so every control is where his thumb already
     expects it. */
  #write{grid-template-rows:auto auto auto minmax(0,1fr) auto;}
  /* The WORD is the say-it button. Everything else on this screen speaks only
     when the character changes or is finished, so mid-character the only way to
     hear it again was to navigate away — which throws the strokes away. It is
     the word rather than a fourth bar icon because the bar cannot take one:
     three 76px icons plus their gaps are 276px of a 284px content box at 320,
     leaving 8px for the back label. Tapping the word to hear the word is also
     the bigger target and the plainer mapping (RULE 5 wants whole-card tap
     zones, not small buttons). 76px because it is now a TAP TARGET and the row
     measured 68 as a div. */
  .wlabel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;
          background:rgba(255,255,255,.10);border-radius:22px;padding:12px 16px;
          min-height:76px;width:100%;border:0;font:inherit;color:inherit;
          text-align:left;cursor:pointer;}
  .wlabel:active{transform:scale(.98);}
  .wlabel .wpic{font-size:38px;line-height:1;}
  /* 🗣️ and not 👂 or 👄: BOTH of those are card pictures in this very deck
     (听 listen, 口 mouth), so the ear would sit twice in one row — once as the
     answer and once as the control. 🔊 is free as a picture and collides with
     the sound toggle's own ON state, which is worse. Text-default, so VS16. */
  .wear{font-size:30px;line-height:1;}
  .wsay{display:grid;grid-template-columns:minmax(0,100%);gap:2px;}
  /* Full-strength ink, no dimming. This page's own contrast pass found every
     dimmed run on it below AA, and a pinyin a grown-up reads aloud is no
     different: hierarchy is size and weight. */
  .wpy{color:#fff;font-size:21px;font-weight:800;line-height:1.15;}
  .wmean{color:#fff;font-size:15px;font-weight:700;}
  .wpadwrap{display:grid;place-items:center;min-height:0;}
  /* aspect-ratio keeps it square where the browser has it; the min-height is
     the iOS 14.2 fallback (Safari 14 has no aspect-ratio at all), and because
     the pad is an SVG with a viewBox the glyph simply letterboxes there rather
     than collapsing. max-height is what keeps a short landscape phone from
     pushing the nav off the bottom. */
  .wpad{width:100%;max-width:440px;aspect-ratio:1/1;min-height:200px;max-height:100%;
        background:#fff;border-radius:34px;box-shadow:0 12px 0 rgba(0,0,0,.22);
        touch-action:none;}
  .wpad:focus-visible{outline:4px solid #fff;outline-offset:6px;}
  .wguide{stroke:#EDE6F7;stroke-width:7;stroke-dasharray:26 22;}
  .wghost{fill:rgba(33,18,63,.13);}
  .wdone{fill:#21123F;}
  .whintfill{fill:rgba(255,107,87,.20);}
  /* The marching ants travel from the start of the stroke toward its end, so
     the hint carries DIRECTION as well as position — half of stroke order. The
     dot marks where the brush goes down, which is the same "numbered dot over a
     faint guide" language Letter Maker and 描福字 already taught him. */
  .wmed{fill:none;stroke:#FF6B57;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;
        stroke-dasharray:54 46;animation:wmarch 1.05s linear infinite;}
  .wstart{fill:#FF6B57;}
  .wtrail{fill:none;stroke:#3FBFEF;stroke-width:26;stroke-linecap:round;stroke-linejoin:round;}
  .winkin{animation:winkin .42s ease-out;}
  /* The finished cue greens the INK, not the ghost behind it: on a one-stroke
     character the ghost is completely covered by the stroke he just wrote, so
     greening that left 一 looking identical finished and unfinished. */
  .wpad.done .wdone{fill:#2C7A3F;}
  .wpad.done{animation:wpop .4s ease-out;}
  .wpad.nudge{animation:wnudge .34s ease;}
  @keyframes wmarch{to{stroke-dashoffset:-100;}}
  @keyframes winkin{from{opacity:0;}to{opacity:1;}}
  @keyframes wnudge{25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  @keyframes wpop{50%{transform:scale(1.03);}}
  /* ---------- 配对: the matching board ----------
     A BOARD, not a quiz: four characters down the left and the SAME four
     pictures shuffled down the right, and the round ends when it is clear.
     The board empties as he goes, so the last pair is free — a no-fail ramp
     built into the shape rather than bolted on.

     Four pairs is what the shortest phone holds at the kid tap floor: 4 rows
     of 76px plus three 16px gaps is 352px of board, and BOTH numbers are laws.
     So the rows are `1fr` over a 76px floor and neither the tile nor the gap is
     what gives on a short screen — the page's own chrome does, in the media
     query below, which is where the measurement lives. (An earlier draft of
     this comment guessed the board fitted 320x480 outright; measured, it ran
     14px past the fold, and a comment cannot go red.) */
  #match{grid-template-rows:auto auto minmax(0,1fr);}
  /* Grid gap, never flex: Safari 14 DROPS gap inside a flex container, and on
     a matching board that is every tile touching its neighbours. */
  .mboard{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0;}
  .mcol{display:grid;grid-auto-rows:minmax(76px,1fr);gap:16px;min-height:0;}
  .mtile{
    min-height:76px;min-width:0;border:0;border-radius:22px;cursor:pointer;
    font-family:inherit;color:var(--ink);background:#fff;padding:6px;
    display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.22);
    transition:background .25s ease,box-shadow .14s ease;
  }
  .mtile:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.22);}
  .mtile:focus-visible{outline:4px solid #fff;outline-offset:3px;}
  .mchar{font-weight:800;font-size:clamp(2.2rem,11vmin,4.4rem);line-height:1;}
  .mpic{font-size:clamp(2rem,10vmin,4rem);line-height:1;}
  /* The held tile is RINGED, never scaled. A scale cue on a gapped grid eats
     the inter-tile gap and can drop it under the spacing floor — the
     documented Copy Me! defect — while a ring paints outside layout, so the
     measured gap is unchanged. */
  .mtile.held{background:var(--card);box-shadow:0 0 0 5px #fff,0 8px 0 rgba(0,0,0,.22);}
  /* A matched pair is CONSUMED, not removed: taking it out of the grid would
     reflow the rows under his thumb mid-round. It keeps its box and goes
     green — a solid fill with FULL-STRENGTH ink, not a dim, because this
     page's own contrast pass found every dimmed run on it below AA. */
  .mtile.done{background:#B7E4C7;box-shadow:none;cursor:default;}
  /* THE ONE PARENT-GATED CONTROL ON THIS PAGE, and the gate is a HOLD — which is
     the mechanism RULE 5 names. Going back to round 1 throws away where he got
     to, and a bar button a four-year-old can reach is a button he WILL press,
     so on a plain tap he would simply live on round 1 for ever and the place
     memory would be pointless. It FILLS while held, so it teaches itself
     instead of being a secret the parent also cannot find.

     The fill is deliberately NOT switched off under prefers-reduced-motion: it
     is a progress READOUT, not decoration, and removing it would leave the
     control either silent or — worse — instantly full, which reads as done when
     nothing has happened. No @keyframes is involved, so the reduced-motion law
     next door has nothing to say about it. */
  .icon.hold{background-image:linear-gradient(var(--card),var(--card));
             background-repeat:no-repeat;background-position:bottom;
             background-size:100% 0;transition:background-size .8s linear;}
  .icon.hold.holding{background-size:100% 100%;}
  .mtile.miss{animation:mnudge .34s ease;}
  .mtile.hintme{animation:mhint .9s ease 2;}
  /* ---------- 👂 Hear it, find it ----------
     The page says a word and he taps it from three WRITTEN words. The choices
     are the matching board's own tiles (.mtile), so a tile looks, presses,
     wiggles and glows exactly as it does one screen over, and every colour law
     that already holds for those tiles holds here without a second copy.
     The prompt is one big tap zone that says the word again. While sound is on
     it shows only 🗣️, because the question IS the sound. With sound off it shows
     the picture (or the sight sentence with a blank), so the game still works
     as "see it, find it" — and once he finds the word, the picture is the
     reward either way. */
  #hear{grid-template-rows:auto auto minmax(76px,1fr) auto;}
  .hprompt{position:relative;min-height:76px;min-width:0;width:100%;border:0;border-radius:34px;
           background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer;
           display:grid;place-items:center;padding:14px;overflow:hidden;
           box-shadow:0 12px 0 rgba(0,0,0,.22);}
  .hprompt:active{transform:scale(.98);}
  .hprompt:focus-visible{outline:4px solid #fff;outline-offset:4px;}
  /* The say-it glyph is 写字's own (.wear), for the same reason: 👂 is the
     "ear" card's picture, and this tile SHOWS the card's picture as its reward,
     so an ear would sit here twice. Big while it is the whole question, then a
     corner mark once there is a picture to look at.
     The picture and the big glyph are sized by hFit() from the tile's REAL box,
     not by vmin: the tile is whatever height the screen has left over — 84px
     at 320x480 and 400 at 390x844 — so a viewport unit either overflows the
     short one or leaves the tall one nearly empty. These are the fallbacks. */
  .hprompt .wear{font-size:48px;}
  .hprompt.cued .wear{position:absolute;top:12px;right:16px;font-size:30px;}
  .hcue{font-size:48px;line-height:1;}
  .hcue.sentence{font-size:clamp(1.4rem,7vmin,3.4rem);font-weight:800;line-height:1.35;
                 max-width:86%;text-align:center;}
  .hblank{display:inline-block;min-width:2.2em;border-bottom:.1em solid var(--ink);}
  /* Grid gap, never flex, for the reason the matching board gives. */
  .hchoices{display:grid;grid-template-columns:minmax(0,100%);grid-auto-rows:minmax(76px,auto);gap:16px;}
  .hword{font-size:clamp(1.9rem,9vmin,3.6rem);font-weight:800;line-height:1;white-space:nowrap;}
  /* ---------- 新字: meet a new character ----------
     One stage and one row. The stage is ONE big tap zone that says it again;
     the row is either ▶ or the three tiles of a question — the matching
     board's own .mtile, so a tile looks, wiggles and glows exactly as it does
     two screens over. ▶ is ONE element for every step, so a double-tap on it
     is the same control twice, which the page's echo guard swallows.
     The big pieces are sized from the stage's REAL box (--lbox, set by
     lFit()), for the reason the listening tile is: the stage is whatever the
     screen has left over, and a viewport unit either overflows a short phone
     or leaves a tall one nearly empty. */
  #learn{grid-template-rows:auto auto minmax(0,1fr) auto;}
  .lstage{position:relative;min-height:0;min-width:0;width:100%;border:0;border-radius:34px;
          background:#fff;color:var(--ink);font-family:inherit;cursor:pointer;padding:14px;
          display:grid;grid-template-columns:minmax(0,100%);overflow:hidden;
          box-shadow:0 12px 0 rgba(0,0,0,.22);}
  .lstage:active{transform:scale(.99);}
  .lstage:focus-visible{outline:4px solid #fff;outline-offset:4px;}
  .lstage .wear{position:absolute;top:12px;right:16px;font-size:30px;}
  .lview{display:grid;grid-template-columns:minmax(0,100%);grid-template-rows:auto minmax(0,1fr) auto;
         justify-items:center;align-items:center;gap:8px;min-height:0;}
  .lview.l-find,.lview.l-ask{grid-template-rows:minmax(0,1fr);}
  .lview.l-cheer{grid-template-rows:auto minmax(0,1fr);}
  .lpic{font-size:calc(var(--lbox, 240px) * .2);line-height:1;}
  .l-find .lpic,.l-ask .lpic{font-size:calc(var(--lbox, 240px) * .6);}
  .l-cheer .lpic{font-size:calc(var(--lbox, 240px) * .3);}
  .lchar,.lchars,.lpartg,.lword,.lzh,.hzr{font-family:var(--hz-face);}
  .lchar,.lchars{font-weight:800;line-height:1;}
  .lchar{font-size:calc(var(--lbox, 240px) * .5);}
  /* One row, sized by lShow() for how many there are, so four fit as well as two. */
  .lchars{display:grid;grid-auto-flow:column;gap:.15em;}
  .lkey{font-size:max(20px, calc(var(--lbox, 240px) * .05));font-weight:800;}
  /* The clue row. A part carries its colour twice — the glyph and a bar under
     it — so which part is which is told by position and shape as well as hue. */
  .lclue{display:grid;grid-auto-flow:column;align-items:center;gap:12px;
         font-size:max(30px, calc(var(--lbox, 240px) * .13));line-height:1.1;}
  .lpart{display:grid;grid-auto-flow:column;align-items:center;gap:4px;
         border-bottom:6px solid;padding:0 .08em .06em;}
  .lpartg,.lword,.lplus{font-weight:800;}
  .lpartn{font-size:.8em;}
  .lsvg{width:100%;height:100%;min-height:0;}
  .lghost{fill:rgba(33,18,63,.10);}
  .lbrush{fill:none;stroke-width:190;stroke-linecap:round;stroke-linejoin:round;}
  .lnote{font-size:max(15px, calc(var(--lbox, 240px) * .036));font-weight:700;line-height:1.3;
         text-align:center;max-width:94%;}
  .lzh{font-size:max(22px, calc(var(--lbox, 240px) * .13));font-weight:800;line-height:1.35;text-align:center;}
  .len{font-size:clamp(.95rem,4.2vmin,2rem);font-weight:700;line-height:1.3;text-align:center;}
  /* The new character in a word or a sentence: colour AND an underline. */
  .lmark{color:#9A3412;border-bottom:.08em solid #9A3412;}
  .lrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:84px;gap:16px;}
  /* The English speaker takes the row's first column and ▶ the other two, so
     the step he will press most stays the biggest thing on the row. White, the
     stage's own card, so it never reads as ▶. It shares ▶'s visibility: both
     give way to the three tiles while he is being asked. */
  .lsay{border:0;border-radius:26px;background:#fff;color:var(--ink);font-family:inherit;cursor:pointer;
        display:grid;justify-items:center;align-content:center;gap:2px;
        box-shadow:0 8px 0 rgba(0,0,0,.22);}
  .lsay .wear{font-size:34px;}
  .lsayn{font-size:13px;font-weight:800;}
  .lsay:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.22);}
  .lsay:focus-visible{outline:4px solid #fff;outline-offset:3px;}
  .lgo{grid-column:2 / -1;border:0;border-radius:26px;background:var(--card);color:var(--ink);
       font-family:inherit;font-size:34px;line-height:1;cursor:pointer;
       box-shadow:0 8px 0 rgba(0,0,0,.22);}
  .lgo:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.22);}
  .lgo:focus-visible{outline:4px solid #fff;outline-offset:3px;}
  /* Four rows at the 76px tap floor plus three 16px gaps is 352px of board, and
     BOTH of those numbers are laws — so on the shortest phone the page's own
     chrome is what yields, never the tile or the gap. Measured: 320x480 is the
     one size where the tile floor binds, and without this the board runs 14px
     past the fold while the deck and the writing pad both fit there with room
     to spare. They each have a single flexible element that simply shrinks; a
     board of fixed rows does not. The safe-area term stays, or a notched phone
     would trade a scroll for a clipped control.

     Both declarations are load-bearing and were A/B'd to find that out — the
     top padding alone takes 320x480 from 14px of scroll to 6 and the wrap gap
     closes it, while a matching BOTTOM padding trim measured byte-identical
     and is not here: the board's own height is fixed at the tap floor, so only
     where it STARTS can move. bar-to-tile stays 40px, well clear of the 16px
     spacing law, because the meter sits between them. */
  @media (max-height:520px){
    #match,#hear{display:grid;padding-top:calc(env(safe-area-inset-top, 0px) + 10px);gap:12px;}
    /* The listening board has one more row than the matching board — its
       prompt, itself a 76px tap target — and three 76px words with two 16px
       gaps below it. Both numbers are laws, so again the chrome yields, and the
       meter is the one piece of chrome Josh never reads. Measured at 320x480:
       with the meter the prompt is squeezed to its 76px floor and the last word
       runs INTO the page's bottom padding (6px from the edge, where the notch
       phones' home bar lives); without it the words stop where the padding
       begins, 26px clear.
       And with the meter gone the BAR sits straight on the prompt, and both are
       tap targets, so the gap goes back to the full 16px here, as the lesson
       screen's does below. It shipped sharing the matching board's 12px (fine
       there, where the meter sits between), which put ‹ back 12px above the
       prompt he taps to hear the word again, and the prompt 12px above the
       words. The 8px it costs comes out of the prompt, which is the one row
       that can give: at 320x480 it lands exactly on its 76px floor. */
    #hear{grid-template-rows:auto minmax(76px,1fr) auto;gap:16px;}
    #hear .meter{display:none;}
    /* The lesson screen yields the same chrome for a different reason: its
       stage is where the character is WRITTEN. The meter goes here; the
       grown-up's line has already gone (below). Its gap stays the full 16px:
       with the meter gone the bar sits straight on the stage, and the stage is
       itself a tap target, so the spacing law binds there. */
    #learn{display:grid;padding-top:calc(env(safe-area-inset-top, 0px) + 10px);gap:16px;
           grid-template-rows:auto minmax(0,1fr) auto;}
    #learn .meter{display:none;}
  }
  /* The grown-up's line is the one thing on the lesson stage he does not need —
     the voice says the story in Chinese and the stage's own label carries the
     English — and on a short phone it is what squeezes the drawing. Measured:
     at 320x480 it took four lines and left the drawing 49px tall; at 320x568 it
     still held the drawing to 133px, and to 114px once the text was set as wide
     as a wider engine font draws it. So it yields before the meter does, and
     the drawing keeps the space. */
  @media (max-height:600px){ #learn .lnote{display:none;} }
  @keyframes mnudge{25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
  @keyframes mhint{50%{box-shadow:0 0 0 5px #FF6B57,0 8px 0 rgba(0,0,0,.22);}}
  @media (prefers-reduced-motion:reduce){ .card,.fill,.face{transition:none;} .pop{animation:none;}
    .wmed,.winkin,.wpad.nudge,.wpad.done{animation:none;}
    .mtile{transition:none;} .mtile.miss,.mtile.hintme{animation:none;}
    .lbrush{transition:none !important;} }
</style>
</head>
<body>

<div class="wrap hidden" id="deck">
  <div class="bar">
    <button class="back" id="back" aria-label="Back to all the decks">&lsaquo;&nbsp; All words</button>
    <button class="icon snd" id="sound" aria-pressed="false" aria-label="Say each word out loud">&#128263;</button>
    <button class="icon" id="shuffle" aria-label="Shuffle these cards">&#128256;</button>
  </div>
  <div class="meter">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">1 / 500</span>
  </div>
  <div class="scene">
    <button class="card" id="card" aria-label="Flip the card">
      <div class="face" id="frontFace"><div class="word" id="word">cat</div><div class="hint">tap me</div></div>
      <div class="face back-face" id="backFace" aria-hidden="true"><div class="pic" id="pic">&#128049;</div><div class="letters" id="letters"></div></div>
    </button>
  </div>
  <div class="nav">
    <button id="prev" aria-label="Card before">&lsaquo;</button>
    <button class="nsay hidden" id="nsay" type="button" aria-label="Say it in English"><span class="wear" aria-hidden="true">&#127482;&#127480;</span><span class="nsayn">English</span></button>
    <button id="next" aria-label="Next card">&rsaquo;</button>
  </div>
</div>

<div class="wrap hidden" id="write">
  <div class="bar">
    <button class="back" id="wback" aria-label="Back to all the decks">&lsaquo;&nbsp; Writing</button>
    <button class="icon snd" id="wsound" aria-pressed="false" aria-label="Say each character out loud">&#128263;</button>
    <button class="icon" id="wshow" aria-label="Show me how to write this stroke">&#9997;&#65039;</button>
  </div>
  <div class="meter">
    <div class="track"><div class="fill" id="wfill"></div></div>
    <span class="count" id="wcount">1 / 120</span>
  </div>
  <button class="wlabel" id="wsaybtn" type="button">
    <span class="wpic" id="wpic" aria-hidden="true">&#128049;</span>
    <span class="wsay"><span class="wpy" id="wpy"></span><span class="wmean" id="wmean"></span></span>
    <span class="wear" aria-hidden="true">&#128483;&#65039;</span>
  </button>
  <div class="wpadwrap">
    <svg class="wpad" id="wpad" viewBox="0 0 1024 1024" role="img" aria-label="Writing pad">
      <g class="wguide" aria-hidden="true">
        <line x1="512" y1="44" x2="512" y2="980"/>
        <line x1="44" y1="512" x2="980" y2="512"/>
      </g>
      <!-- The stroke data is authored in a 1024 box with y running UPWARD, so
           ONE transform flips the whole glyph and every coordinate below stays
           in the data's own space. Nothing hand-flips a number. -->
      <g id="wglyph" transform="translate(0,900) scale(1,-1)">
        <g id="wghost" class="wghost"></g>
        <g id="wdone" class="wdone"></g>
        <g id="whint"></g>
        <path id="wtrail" class="wtrail"></path>
      </g>
    </svg>
  </div>
  <div class="nav">
    <button id="wprev" aria-label="Character before">&lsaquo;</button>
    <button id="wnext" aria-label="Next character">&rsaquo;</button>
  </div>
</div>

<div class="wrap hidden" id="match">
  <div class="bar">
    <button class="back" id="mback" aria-label="Back to all the decks">&lsaquo;&nbsp; Matching</button>
    <button class="icon snd" id="msound" aria-pressed="false" aria-label="Say each character out loud">&#128263;</button>
    <button class="icon hold" id="mreset" aria-label="For a grown-up: hold this down to go back to round 1">&#9198;&#65039;</button>
  </div>
  <div class="meter">
    <div class="track"><div class="fill" id="mfill"></div></div>
    <span class="count" id="mcount"></span>
  </div>
  <div class="mboard">
    <div class="mcol" id="mchars"></div>
    <div class="mcol" id="mpics"></div>
  </div>
</div>

<div class="wrap hidden" id="hear">
  <div class="bar">
    <button class="back" id="hback" aria-label="Back to all the decks">&lsaquo;&nbsp; Hear it</button>
    <button class="icon snd" id="hsound" aria-pressed="false" aria-label="Say each word out loud">&#128263;</button>
    <button class="icon hold" id="hreset" aria-label="For a grown-up: hold this down to go back to the first word">&#9198;&#65039;</button>
  </div>
  <div class="meter">
    <div class="track"><div class="fill" id="hfill"></div></div>
    <span class="count" id="hcount"></span>
  </div>
  <button class="hprompt" id="hsay" type="button" aria-label="Hear the word again">
    <span class="hcue hidden" id="hcue" aria-hidden="true"></span>
    <span class="wear" aria-hidden="true">&#128483;&#65039;</span>

  <div class="hchoices" id="hchoices"></div>
</div>

<div class="wrap hidden" id="learn">
  <div class="bar">
    <button class="back" id="lback" aria-label="Back to all the decks">&lsaquo;&nbsp; Lessons</button>
    <button class="icon snd" id="lsound" aria-pressed="false" aria-label="Say each character out loud">&#128263;</button>
    <button class="icon hold" id="lreset" aria-label="For a grown-up: hold this down to go back to the first lesson">&#9198;&#65039;</button>
  </div>
  <div class="meter">
    <div class="track"><div class="fill" id="lfill"></div></div>
    <span class="count" id="lcount"></span>
  </div>
  <button class="lstage" id="lstage" type="button" aria-label="Hear it again">
    <span class="lview" id="lview"></span>
    <span class="wear hidden" id="lwear" aria-hidden="true">&#128483;&#65039;</span>
  </button>
  <div class="lrow" id="lrow">
    <button class="lsay" id="lsay" type="button" aria-label="Say it in English"><span class="wear" aria-hidden="true">&#127482;&#127480;</span><span class="lsayn">English</span></button>
    <button class="lgo" id="lgo" type="button" aria-label="Next">&#9654;</button>
  </div>
</div>

<div class="wrap" id="menu">

    <a class="home" href="./#home" aria-label="Back to Josh's Games">&#127968;</a>
    <div>
      <h1 class="title">Word Cards</h1>
      <div class="sub">Read the word, then tap to see it.</div>
    </div>
  </div>
  <!-- Every count on this page is COUNTED from the data. A literal is a claim
       that goes stale the moment a card is added or removed. -->
  <h2 class="sect">Learning to read</h2>
  <div class="grid" id="readGrid"></div>
  <!-- `.mode`, like 写字 and 配对: it opens its own screen, not the card deck.
       The ear is aria-hidden so the button is NAMED by its words; its count is
       written by the script, like every other count on this page. -->
  <button class="mode" id="hearBtn"><span><b aria-hidden="true">&#128066;</b> Hear&nbsp;it, find&nbsp;it</span> <small></small></button>
  <!-- One button, not a grid: a single chip in a two-column grid orphans its
       row, which is the same even-fill reasoning the fort's contents row is
       held to. The count is written by the script, like every other count on
       this page. -->
  <h2 class="sect">Chinese</h2>
  <button class="all hz" id="hanziBtn"><span><b lang="zh-CN">&#20013;&#25991;</b> Chinese Characters</span> <small></small></button>
  <!-- `.mode`, not `.all`: `.all` means "opens a whole-library card DECK" to two
       derived test walks, and this opens the writing pad instead. It takes the
       same style and none of the meaning. -->
  <button class="mode hz" id="writeBtn"><span><b lang="zh-CN">&#20889;&#23383;</b> Write Characters</span> <small></small></button>
  <button class="mode hz" id="matchBtn"><span><b lang="zh-CN">&#37197;&#23545;</b> Match Characters</span> <small></small></button>
  <!-- The 96 characters from the L1 list that the 中文 cards do not have. The
       other three buttons ask him to RECALL a character; this one TEACHES one
       he has never seen, so it gets its own screen and its own lessons. -->
  <button class="mode hz" id="learnBtn"><span><b lang="zh-CN">&#26032;&#23383;</b> New Characters</span> <small></small></button>
  <h2 class="sect">Letter teams</h2>
  <div class="grid" id="teamGrid"></div>
  <h2 class="sect">Bossy R</h2>
  <div class="grid" id="bossyGrid"></div>
  <h2 class="sect">Words and pictures</h2>
  <button class="all" id="allBtn">Every word <small></small></button>
  <div class="grid" id="grid"></div>
</div>

/* ---------- sounds, not letters ----------
   "ship" is THREE sounds (sh-i-p) and the strip used to show four. That is
   wrong on 67 words, on exactly the skill Josh is working on. An algorithm
   alone is not safe, so each rule carries a verified exception list: "ng" is
   one sound in sing and ring and is plain n+g in penguin, kangaroo, mango,
   orange, finger, sponge and flamingo. A doubled consonant is always one.

   The table is also the ONE owner of "these letters are a TEAM": the strip
   splits on it AND every deck in the Letter teams section is derived from it,
   so a deck can never claim a team the card then contradicts. It could —
   anchor and parachute were kept out of the Sound Teams deck by a SECOND list
   while the strip still showed both of them a ch tile, which is the very
   counter-example that deck exists to avoid, handed over by the other half of
   the same feature.

   The order is the order he MEETS them — consonant teams, then vowel teams,
   then bossy r — and it is MOSTLY free: measured, moving er or ur to the front
   of the table changes not one of the 503 strips. It is also the matching
   precedence, and exactly TWO rules need that, because they are the only pairs
   that can match at the SAME letter: air must beat ai (or chair splits ch-ai-r)
   and oar must beat oa (or skateboard splits b-oa-r-d).

   tch LOOKS like a third and is not. ch can never match where tch does — no
   string starts with both — so their order is free as well, measured; what
   watch needs is for tch to be PRESENT, or it splits w-a-t-ch. Presence is the
   guarantee there and order is the guarantee for the other two. */
const SOUND_RULES = [
  ["tch", []],                          // first: watch is wa-tch, not wat-ch
  ["sh", []],
  ["ch", ["anchor","parachute"]],       // anchor's ch is /k/, parachute's is /sh/
  ["th", []],
  ["ck", []],
  ["ng", ["penguin","kangaroo","mango","orange","finger","sponge","flamingo","tongue"]],
  ["ph", []],
  ["qu", []],
  ["wh", []],
  ["air", []],                          // must beat ai: chair is ch-air
  ["oar", []],                          // must beat oa: skateboard is b-oar-d
  ["ee", []],
  ["oo", ["door"]],                     // door is "dor" — that oo is not the team
  ["oa", ["koala"]],                    // koala is k-o-a-la across a syllable
  ["ai", ["mountain"]],                 // mountain's ai is a schwa, not the team
  ["ay", []],
  ["igh", ["eight"]],                   // eight is ei-gh, not igh
  ["ow", []],
  ["ou", ["soup","four"]],              // soup is /oo/ and four is /or/
  ["oi", []],
  ["oy", ["yoyo"]],                     // yo-yo: the o and y are different syllables
  /* BOSSY R, last for TEACHING order rather than for matching — measured,
     these five can sit anywhere. Each exception list is a word whose letters
     say something else, and they are the reason this could not be a substring
     match: bear/pear/hare are the /air/ sound, earth is /er/, heart is /ar/
     but SPELLED ear, parrot and carrot are a short a, lizard and wizard end
     in /erd/, and worm says "werm". Sorting those out by hand is the work. */
  ["ar", ["bear","pear","ear","heart","earth","beard","hare","scared",
          "parrot","carrot","parachute","lizard","wizard","kangaroo"]],
  ["er", ["zero","berry","cherry","ferry","strawberry"]],
  ["ir", ["giraffe","mirror","fire","firefighter","siren"]],
  ["or", ["worm","mirror","tractor","doctor","scissors","anchor","motorbike","door"]],
  ["ur", ["four","dinosaur","burrito"]],
];
const DOUBLE = /^(bb|cc|dd|ff|gg|ll|mm|nn|pp|rr|ss|tt|zz)/;
function sounds(word){
  const w = String(word), out = [];
  let i = 0;
  outer: while (i < w.length){
    const rest = w.slice(i).toLowerCase();
    for (const r of SOUND_RULES){
      if (rest.startsWith(r[0]) && r[1].indexOf(w.toLowerCase()) < 0){
        out.push(w.substr(i, r[0].length)); i += r[0].length; continue outer;
      }
    }
    if (DOUBLE.test(rest)){ out.push(w.substr(i, 2)); i += 2; continue; }
    out.push(w[i]); i += 1;
  }
  return out;
}

/* ---------- a deck order he cannot guess ----------
   Every category used to be sorted short -> long (animals ran 3 to 8 letters),
   numbers ran zero..ten in counting order, and opposites sat back to back
   (wet/dry, old/new, fast/slow, mom/dad). All three let him predict the next
   card instead of reading it. The order below is SEEDED, so it is the same
   every time and a grown-up can track where he got to, and it is repaired so
   no two neighbours share a picture or make a guessable pair. */
function seedOf(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rngFrom(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const PAIRSET = {};
for (const p of PAIRS){ PAIRSET[p[0]+"|"+p[1]]=1; PAIRSET[p[1]+"|"+p[0]]=1; }
function clash(a,b){
  if (!a || !b) return false;
  if (a[2] !== "sight" && b[2] !== "sight" && a[1] === b[1]) return true;
  return !!PAIRSET[a[0]+"|"+b[0]];
}
function teachingOrder(list, seedText){
  const out = list.slice(), r = rngFrom(seedOf(seedText));
  for (let k=out.length-1;k>0;k--){ const j=Math.floor(r()*(k+1)); const t=out[k]; out[k]=out[j]; out[j]=t; }
  for (let k=1;k<out.length;k++){
    if (!clash(out[k-1], out[k])) continue;
    for (let j=k+1;j<out.length;j++){
      const t=out[k]; out[k]=out[j]; out[j]=t;
      if (!clash(out[k-1],out[k]) && !clash(out[j-1],out[j]) && (j+1>=out.length || !clash(out[j],out[j+1]))) break;
      out[j]=out[k]; out[k]=t;
    }
  }
  return out;
}

/* ---------- the reading decks, derived from the cards themselves ---------- */
// Letter-CVC is not the same as SOUND-CVC, and this deck's promise is that you
// can sound the word out. A final w, y or r is not a consonant here — it marks
// a vowel team or an r-controlled vowel, so cow, key, boy, saw and car are not
// blendable: a child sounding out k-e-y gets nothing. They stay in the picture
// decks, where the word is not being decoded.
const CVC = /^[bcdfghjklmnpqrstvwxyz][aeiou][bcdfghjklmnpqstvxz]$/;
const byWord = {}; for (const w of WORDS) byWord[w[0]] = w;
function firstWords(){ return WORDS.filter(w => w[2] !== "sight" && CVC.test(w[0])); }
function familyDeck(){
  const out = [];
  for (const f of FAMILIES) for (const w of f[1]) if (byWord[w]) out.push(byWord[w]);
  return out;
}
// A team deck is DERIVED from sounds(): a word is in the ck deck exactly when
// the card's own strip shows it a ck tile. That is what keeps the chip and the
// card honest with each other, and it is how anchor and parachute leave the ch
// deck now — by the splitter excepting them, not by a second list agreeing to.
/* Which word best TEACHES a team is an editorial call and not a length. Picked
   by length alone the oo deck led with "hook", which teaches one of oo's two
   sounds while everybody's name for that team is "oo like MOON" — so the
   exemplar is declared, it leads its own deck (the chip and the first card he
   meets then agree), and a guardrail requires every one to be a real member of
   the deck it names, so it cannot drift out of the data underneath it. */
const TEAM_LIKE = { sh:"ship", ch:"chick", th:"tooth", ck:"duck", ng:"ring",
                    ph:"phone", qu:"squid", ee:"bee", oo:"moon", oa:"boat",
                    ai:"rain", ow:"cow", ou:"house",
                    ar:"car", er:"tiger", ir:"bird", or:"corn", ur:"turtle" };
function teamWords(pg){
  const hit = WORDS.filter(w => w[2] !== "sight" &&
    sounds(w[0]).some(t => t.toLowerCase() === pg));
  const lead = TEAM_LIKE[pg];
  // Scaffolded SHORT WORD FIRST — duck and rock before bucket and backpack — so
  // a deck opens on the 3- and 4-letter words he already decodes and walks out
  // to the two-syllable ones, which is the whole reason a phonogram beats a
  // rime: -ock only ever helps with rock and sock, ck helps with bucket too.
  // That is the opposite of a picture deck, where a length ramp was a way to
  // GUESS the next card; here every card carries the same team, so length gives
  // nothing away and the ramp IS the lesson. Ties keep the seeded order and
  // sort is stable, so a deck reads the same every time.
  return teachingOrder(hit, "team " + pg)
    .sort((a, b) => (b[0] === lead) - (a[0] === lead) || a[0].length - b[0].length);
}
function teamDeck(){
  const out = [];
  for (const t of ["sh","ch","th"]) for (const w of teamWords(t)) if (out.indexOf(w) < 0) out.push(w);
  return out;
}
// A deck is a lesson; two cards is not. The bar is DERIVED, so a team that
// reaches it when a card is added gets its chip with no code change — and the
// thin ones (tch, air, oar, wh, ay, igh, oi, oy) are named by nothing, they
// simply do not clear it. igh is the one worth knowing about: light,
// firefighter and lightning are all it has, and night has no picture a
// four-year-old names "night" at Emoji <= 13.0, so it is short by one word
// rather than by design. air and oar are in the table to fix a SPLIT rather
// than to teach a deck — chair and skateboard — and would get a chip on their
// own if the deck ever grew to four.
const TEAM_MIN = 4;
/* Bossy R gets its own section because it is its own lesson and its own name
   in every phonics book: a vowel with an r after it stops saying its own name.
   The split is DERIVED from the pattern — a single vowel then r IS the
   definition — rather than listed, so the two grids cannot drift from the
   table, and it deliberately does NOT claim air/ear/oar, which are vowel TEAMS
   with an r and are taught separately. It also keeps each grid readable:
   thirteen chips and five, rather than one run of eighteen. */
const BOSSY = /^[aeiou]r$/;
function teamDecks(){
  const out = [];
  for (const r of SOUND_RULES){
    const list = teamWords(r[0]);
    if (list.length >= TEAM_MIN) out.push([r[0], list]);
  }
  return out;
}
function rimeOf(word){
  for (const f of FAMILIES) if (f[1].indexOf(word) >= 0) return f[0];
  return "";
}

/* ---------- 👂 Hear it, find it ----------
   The page says a word and he taps it from three WRITTEN words — the mechanic
   his profile names for exactly this skill ("hear a word, tap the matching one
   of 3"). The two wrong words are chosen to LOOK like the answer (cat / rat /
   car), so the only way to find it is to read it: a wrong word that differed in
   every letter could be found by its first letter, or its length, alone.

   What may share a board:
     - never the word itself, and never a word that SOUNDS the same — the
       question is spoken, so to/two or be/bee would be two right answers.
       HOMOPHONES is checked against a pronunciation dictionary
       (tests/pronunciations.js): typed by hand it missed fairy/ferry, which
       an American voice says identically;
     - never a word the voice reads out as letters or a guess (tv, ufo), and
       never a one-letter word (a, I), whose spoken form is ambiguous;
     - otherwise the two closest SPELLINGS, ties broken by a seed, so a word's
       board is the same board every time he meets it.

   The ladder is easiest first, built from decks this page already owns: the
   First Words (he decodes these — his profile's mastered skill), then the
   Sight Words (his working edge), then everything else by how many SOUNDS it
   has, so duck and ship come long before crocodile.

   No-fail (RULE 5): a wrong tap is a wiggle and the word again, three misses
   make the right word glow, and there is no score and no timer. */
const HEAR_SKIP = ["tv", "ufo"];
const HOMOPHONES = [["to","two"], ["for","four"], ["be","bee"], ["not","knot"], ["red","read"], ["fairy","ferry"]];
const HOMOSET = {};
for (const p of HOMOPHONES){ HOMOSET[p[0] + "|" + p[1]] = 1; HOMOSET[p[1] + "|" + p[0]] = 1; }
function soundsAlike(a, b){ return a === b || !!HOMOSET[a + "|" + b]; }
function editDistance(a, b){
  let prev = [];
  for (let j = 0; j <= b.length; j++) prev.push(j);
  for (let k = 1; k <= a.length; k++){
    const cur = [k];
    for (let j = 1; j <= b.length; j++)
      cur.push(Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[k - 1] === b[j - 1] ? 0 : 1)));
    prev = cur;
  }
  return prev[b.length];
}
function hearPool(){ return WORDS.filter((w) => w[0].length >= 2 && HEAR_SKIP.indexOf(w[0]) < 0); }
function hearDeck(){
  const first = new Set(firstWords());
  const tier = (w) => first.has(w) ? 0 : w[2] === "sight" ? 1 : 2;
  const key = new Map();
  for (const w of hearPool()){
    const t = tier(w);
    key.set(w, t * 1e6 + (t === 2 ? sounds(w[0]).length * 100 : 0) + (t ? w[0].length : 0));
  }
  // Ties keep the seeded order (sort is stable), so a tier is not alphabetical
  // and the ladder reads the same every time.
  return teachingOrder(hearPool(), "Hear").sort((a, b) => key.get(a) - key.get(b));
}
const HEAR_CHOICES = 3;
function hearChoices(word){
  const r = rngFrom(seedOf("hear " + word));
  const ranked = hearPool().filter((w) => !soundsAlike(w[0], word))
    .map((w) => ({ w: w[0], d: editDistance(w[0], word) + Math.abs(w[0].length - word.length) / 2, t: r() }))
    .sort((a, b) => a.d - b.d || a.t - b.t);
  const out = [];
  for (const c of ranked){
    if (out.length >= HEAR_CHOICES - 1) break;
    if (!out.some((o) => soundsAlike(o, c.w))) out.push(c.w);
  }
  // Seeded, like the rest: position must never answer the question.
  out.splice(Math.floor(r() * (out.length + 1)), 0, word);
  return out;
}

/* ---------- 新字: the 96 NEW characters ----------
   The owner's L1 认写字表 (units 1-8), taken against the 120 on the 中文 cards:
   these are the 96 he has NEVER seen. A flash card or a matching board can only
   ask him to RECALL a pairing, so neither can teach them. This mode
   INTRODUCES them, two to four at a time, each in four steps:

     meet — the character, its picture and its word, said out loud;
     see  — its SECRET, while it is written stroke by stroke: the parts it is
            built from, coloured to match (鸡 is 又 and a 鸟 he knows), or the
            picture it grew out of (火), or the word it lives in (这个);
     find — tap it beside two characters he already knows well, so the first
            time he picks it out it is the only stranger on the board;
     read — the sentence it lives in, with it marked;

   and every lesson ends on a REVIEW, which asks for each new character among
   its lesson-mates — the first time he tells it apart from the other new ones.

   Row: [char, picture, "xin", pinyin, meaning, sentence, translation, unit,
         word, story], where story is one of
     ["pic",  zh, en]                          a pictograph: picture -> character
     ["word", zh, en]                          it lives in the WORD, which is shown
     ["parts", layout, [[glyph, [strokes], note], ...], zh, en]
   A part's stroke numbers are the character's own strokes in
   scripts/hanzi-strokes.js, and the parts PARTITION them; a part with no glyph
   shows only its note; the layout says where the first part sits (lr / tb / rl /
   in). All of it is checked against the stroke data by a test. zh is SPOKEN, so
   it may use words he cannot read yet; en is the grown-up's line. Everything he
   is shown to READ — the word, the sentence — uses only characters he has
   already met, or the other half of his own word from the same lesson.

   The meaning and the translation are English TEXT, and he is four: he cannot
   read them. The 🇺🇸 button SAYS them (xinEnglish, below), so a meaning must
   read aloud as well as it reads: senses split by ";", a word it lives in as
   "(彩虹 = rainbow)" or "(天空)", and a second reading as "(also …)", which is
   the grown-up's and is not said.

   The row order IS the teaching order: the owner's units in turn, and inside a
   unit the two halves of a word kept in one lesson (喜/欢, 因/为, 羽/毛, 写/字,
   发/光). */

/* A lesson is two to four characters, balanced INSIDE a unit — never across
   one — in row order. Derived, so a character added to a unit re-balances it
   rather than needing a hand-cut list. */
const LESSON_MAX = 4;
function xinLessons(){
  const out = [];
  for (const u of XINZI.map((c) => c[7]).filter((u, k, a) => a.indexOf(u) === k)){
    const rows = XINZI.filter((c) => c[7] === u);
    const k = Math.ceil(rows.length / LESSON_MAX), base = Math.floor(rows.length / k), extra = rows.length % k;
    for (let j = 0, at = 0; j < k; j++){ const n = base + (j < extra ? 1 : 0); out.push(rows.slice(at, at + n)); at += n; }
  }
  return out;
}
/* Every character is a MEET page and every lesson ends on a REVIEW page. */
function xinPages(){
  const out = [];
  xinLessons().forEach((l, n) => {
    for (const c of l) out.push({ kind: "meet", lesson: n, card: c });
    out.push({ kind: "review", lesson: n, cards: l });
  });
  return out;
}

/* The FIND step puts the new character beside two he already knows well —
   twenty of the plainest shapes on the 中文 cards. */
const XIN_ANCHORS = ["一","二","三","十","人","大","小","口","山","上","下","中",
                     "门","马","牛","羊","鱼","虫","车","水"];
/* …and a known character may NOT stand beside a new one that it could also
   answer, or that it looks like. Two reasons, each a real case:
     - the PICTURE could be answered by it: 🌄 (早) shows a 山, 🥩 and 🧶 come
       from a 牛 and a 羊, a 🏠 has a 门, and a person (哥, 他, 们, 谁…) is a 人;
     - it is WRITTEN INSIDE the new one, or looks like it: 午 and 牛, 土 and 十,
       石 and 口, and the 鸟 in 鸡 and 鸭, which reads as a 马.
   Two more are DERIVED rather than listed: a character in the new one's own
   WORD, and a part its story names. */
const XIN_AVOID = {
  岁:"山", 喜:"十", 欢:"人", 哥:"人大口", 这:"下", 妹:"小十", 弟:"小人", 姐:"人大",
  石:"山口", 也:"十", 空:"上", 住:"人门",
  鸡:"马", 鸭:"马鱼中", 说:"口", 以:"人", 毛:"羊", 尖:"山上",
  和:"口", 动:"二", 日:"口中", 们:"人", 半:"十二羊", 打:"十", 还:"下", 他:"人", 边:"水", 今:"人",
  都:"人", 饿:"口", 土:"十上", 豆:"口", 米:"十", 没:"水", 早:"山", 午:"十牛", 肉:"人牛羊",
  生:"牛", 校:"门", 点:"口", 分:"人", 文:"大", 同:"人门口", 给:"人口", 光:"小",
  百:"十", 甜:"口", 冷:"人", 过:"人车", 做:"人口十", 火:"人", 行:"车", 西:"口", 房:"门",
  谁:"人", 金:"人",
};
function xinParts(c){ return c[9][0] === "parts" ? c[9][2].map((p) => p[0]).filter(Boolean) : []; }
function xinAnchorOK(c, a){
  return c[8].indexOf(a) < 0 && xinParts(c).indexOf(a) < 0 && (XIN_AVOID[c[0]] || "").indexOf(a) < 0;
}
/* Two new characters that make ONE word never share a board: the one gives
   the other away (the reason 太/阳 are a PAIR on the cards). */
function xinWordMates(a, b){ return a[8].indexOf(b[0]) >= 0 || b[8].indexOf(a[0]) >= 0; }
const XIN_CHOICES = 3;
function xinDraw(r, pool, out){
  while (out.length < XIN_CHOICES - 1 && pool.length) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  return out;
}
/* Seeded by the character, so its board is the same board every time and
   position never answers the question. */
function xinFindChoices(c){
  const r = rngFrom(seedOf("xin find " + c[0]));
  const out = xinDraw(r, XIN_ANCHORS.filter((a) => xinAnchorOK(c, a)), []);
  out.splice(Math.floor(r() * (out.length + 1)), 0, c[0]);
  return out;
}
function xinReviewChoices(c, lesson){
  const r = rngFrom(seedOf("xin review " + c[0]));
  const out = xinDraw(r, lesson.filter((m) => m !== c && !xinWordMates(m, c)).map((m) => m[0]), []);
  // A lesson whose other characters are one word with this one (因 为 住:
  // 因为) has too few mates to fill a board, so a familiar one fills it.
  xinDraw(r, XIN_ANCHORS.filter((a) => xinAnchorOK(c, a)), out);
  out.splice(Math.floor(r() * (out.length + 1)), 0, c[0]);
  return out;
}
/* A review never asks in the order he met them — seeded, so position cannot
   do the remembering. */
function xinReviewOrder(lesson, n){
  const r = rngFrom(seedOf("xin order " + n)), out = lesson.slice();
  for (let k = out.length - 1; k > 0; k--){ const j = Math.floor(r() * (k + 1)); const t = out[k]; out[k] = out[j]; out[j] = t; }
  if (out.length > 1 && out.every((c, k) => c === lesson[k])) out.push(out.shift());
  return out;
}

/* What he HEARS. A bare character is one syllable, and a voice reads a
   polyphone its commonest way — which for six of these is not the reading
   they are taught in (为 alone is wéi; here it is wèi, of 为什么). So a bare
   character is voiced through a homophone that has ONLY the right reading. The
   text on the screen never changes, and a word or a sentence is always said as
   itself, because there the voice has the context. */
const XIN_SAY_AS = { 为:"位", 还:"孩", 种:"众", 都:"兜", 长:"常", 行:"形" };
function xinBare(c){ return XIN_SAY_AS[c[0]] || c[0]; }
function xinHello(c){ return c[8] === c[0] ? xinBare(c) : xinBare(c) + "，" + c[8] + "！"; }
function xinAsk(c){ return "哪个是" + (c[8] === c[0] ? "" : c[8] + "的") + xinBare(c) + "？"; }
/* What he hears IN ENGLISH (the 🇺🇸 button). The meaning and the sentence's
   translation are on the screen as English TEXT, and he is four: he cannot
   read them, so the page says them. Derived from the meaning the screen shows,
   not a second copy of it, so the two cannot come to disagree:
     - "stone; rock"                  -> "stone, rock."
     - "colorful (彩虹 = rainbow)"      -> "colorful." 彩虹 "means rainbow."
     - "empty; sky (天空)"              -> "empty." 天空 "means sky."
     - "live (in a place)"            -> "live, in a place."
     - "plant (also zhǒng: seed)"     -> "plant." (a second reading is the grown-up's)
   A Chinese word is said in a CHINESE voice between the English ones, because
   an English voice cannot say it — so a line is a list of [text, lang] parts. */
const HAN_ONLY = /^[⺀-⿟㐀-䶿一-鿿]+$/;
function xinGloss(c){
  const plain = [], bridge = [], senses = [];
  let depth = 0, cur = "";
  for (const t of c[4]){
    if (t === "(") depth++; else if (t === ")") depth--;
    if (t === ";" && !depth){ senses.push(cur.trim()); cur = ""; } else cur += t;
  }
  senses.push(cur.trim());
  for (const s of senses){
    const m = s.match(/^(.*?)\s*\((.*)\)$/);
    if (!m){ plain.push(s); continue; }
    const head = m[1].trim(), inner = m[2].trim();
    if (/^also\b/.test(inner)){ if (head) plain.push(head); }
    else if (HAN_ONLY.test(inner)) bridge.push([inner, head]);
    else if (inner.includes("=")){
      if (head) plain.push(head);
      for (const item of inner.split(",")){
        const kv = item.split("=").map((x) => x.trim());
        bridge.push([kv[0], kv[1]]);
      }
    } else plain.push(head ? head + ", " + inner : inner);
  }
  return { plain, bridge };
}
function endStop(t){ return /[.!?]$/.test(t) ? t : t + "."; }
// Neighbouring parts in one language are ONE utterance: a voice change costs a
// pause, and "chicken." then the sentence needs none.
function joinParts(parts){
  const out = [];
  for (const p of parts){
    const last = out[out.length - 1];
    if (last && last[1] === p[1]) last[0] += " " + p[0]; else out.push([p[0], p[1]]);
  }
  return out;
}
// `said` lets a lesson's recap say a shared word once: 喜 and 欢 are both 喜欢.
function xinDefine(c, said){
  const g = xinGloss(c), out = [];
  if (g.plain.length) out.push([endStop(g.plain.join(", ")), "en-US"]);
  for (const [w, e] of g.bridge){
    if (said && said.has(w) && g.plain.length) continue;
    if (said) said.add(w);
    out.push([w, "zh-CN"], ["means " + endStop(e), "en-US"]);
  }
  return out;
}
function xinEnglish(c){ return joinParts([...xinDefine(c), [c[6], "en-US"]]); }
/* A part's colour. Blue and orange rather than red and green: the one pair
   every common colour-vision deficiency still tells apart. Both clear 4.5:1 on
   the white stage (6.70 and 7.31), because the same colour prints the part's
   glyph in the clue as TEXT. A pictograph or a word is drawn in ink. */
const XIN_INK = ["#1D4ED8", "#9A3412"];
const XIN_PLAIN = "#21123F";

/* ---------- say it out loud ----------
   He reads the front, flips, and HEARS the word confirm it — control of error
   with no grown-up needed. Off by default (RULE 5), one obvious toggle, and
   only ever spoken from inside a tap, which is what iOS requires. */
let soundOn = false;
try { soundOn = localStorage.getItem("wc-sound") === "1"; } catch (e) {}
function voiceFor(lang){
  // getVoices() is empty until the platform has loaded them, and a Linux CI box
  // may have no Chinese voice at all — both simply fall back to the lang TAG,
  // which is what iOS honours anyway (it ships Ting-Ting for zh-CN).
  try {
    const want = lang.slice(0, 2).toLowerCase();
    return (speechSynthesis.getVoices() || []).find(
      (v) => (v.lang || "").slice(0, 2).toLowerCase() === want) || null;
  } catch (e) { return null; }
}
/* A LINE may change language part-way ("西瓜 means watermelon"), so it is a
   list of [text, lang] parts, queued in order after ONE cancel — cancelling
   between them would cut each part off. speak() is the one-part case, so there
   is one owner of how anything on this page is said. */
function speakParts(parts){
  try {
    if (!soundOn || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    for (const [text, lang] of parts){
      if (!text) continue;
      const u = new SpeechSynthesisUtterance(text);
      // A Chinese line left on the page's own en-US voice is read as letter
      // noise, so the LANGUAGE travels with the text rather than being a
      // property of the page.
      u.lang = lang || "en-US";
      const v = voiceFor(u.lang);
      if (v) u.voice = v;
      u.rate = 0.75; u.pitch = 1.05;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
}
function speak(text, lang){ speakParts([[text, lang]]); }
// ONE owner for "what does this card sound like, and in what language" — the
// flip, the sound toggle's preview and anything later all ask it, so they
// cannot come to disagree. A character is ONE syllable: the sentence is what
// makes its tone and the word it lives in audible, so a hanzi card says both.
function cardSpeech(c){
  return c[2] === "hanzi" ? [c[0] + "\u3002" + c[5], "zh-CN"] : [c[0], null];
}

/* ---------- the hammer's echo ----------
   A four-year-old taps twice for every tap he means, ~100-300ms apart, with the
   finger still where it landed — so the second tap lands on whatever is under
   it THEN. On this page that undid the very thing he asked for: the card flip
   is a toggle, so a double-tap flipped it and flipped it straight back and he
   never saw the answer; Next ran twice and skipped a card nobody saw; and a
   double-tap on a deck chip opened the deck and landed the echo on the card
   beneath the finger. Josh's games have the same guard in framework.js; this is
   the page's own, because the page loads no framework. Two rules, for a REAL
   tap only (a synthetic click is code, never a finger):
     1. the same control again inside ECHO_MS is the echo, not a second tap;
     2. an echo that lands on a control that was not ON SCREEN when the tap it
        echoes began (the chip opened the deck, the back button opened the
        menu, a ▶ swapped in three answers) cannot have been aimed — the thing
        under the finger did not exist a moment ago.
   Rule 2 is a COORDINATE rule, because an echo is: the finger is still where it
   landed, so a tap that lands somewhere else on the new screen was aimed, however
   fast. Each swallowed tap re-arms the window, so a hammer streak ends only when
   the hand pauses. A swallowed tap does nothing at all. A keyboard activation
   (detail 0) is never an echo — nobody hammers Enter by accident. The writing
   pad and the ⏮️ hold take pointer events, not clicks, so neither is touched.

   "Another screen" was the first way the page met rule 2, and it is one case of
   a wider one: a control that was NOT ON SCREEN when the first tap began. The
   新字 screen swaps its ▶ for three answer tiles in the same place, on the same
   screen, so an echo of ▶ landed on a tile and answered a question nobody had
   seen. So rule 2 asks what was on screen at the first tap — DERIVED from the
   page every time, never a list of screens or ids. Nothing on this page acts on
   a click that is not a control, so an echo landing between controls is
   swallowed too, which keeps a hammer streak swallowed across a screen change. */
const ECHO_MS = 350, ECHO_PX = 40;
const CONTROLS = "button, [role=button], a";
let lastTap = null;
function onScreen(){
  const seen = new Set();
  for (const el of document.querySelectorAll(CONTROLS)) if (el.getClientRects().length) seen.add(el);
  return seen;
}
document.addEventListener("click", (e) => {
  if (!e.isTrusted || e.detail === 0 || !e.target || !e.target.closest) return;
  const t = e.target, at = performance.now();
  const control = t.closest(CONTROLS) || t;
  const near = lastTap && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < ECHO_PX;
  if (lastTap && at - lastTap.at < ECHO_MS && (control === lastTap.control || (near && !lastTap.seen.has(control)))){
    e.stopImmediatePropagation();
    e.preventDefault();
    lastTap.at = at; // a hammer streak ends only when the hand pauses
    return;
  }
  lastTap = { control, seen: onScreen(), at, x: e.clientX, y: e.clientY };
}, true);

let deck = [], i = 0, deckKind = "";

/* ---------- remember where he got to ----------
   The order is seeded so it is the SAME every time, which is only worth
   anything if you can carry on from where you stopped: a five-minute session
   is about twenty cards, and restarting at card 1 every time means the back
   of a 503-card deck is never reached. Shuffling clears it, since a shuffled
   deck has no "where you were". Storage can throw in private mode, so every
   read and write is guarded and the deck simply starts at the beginning. */
function atKey(){ return "wc-at-" + deckKind; }
function loadAt(n){
  try {
    const v = parseInt(localStorage.getItem(atKey()), 10);
    return (v >= 0 && v < n - 1) ? v : 0;   // finishing wraps back to the start
  } catch (e) { return 0; }
}
function saveAt(){ try { localStorage.setItem(atKey(), String(i)); } catch (e) {} }

/* ---------- menu ---------- */
function chip(host, icon, label, count, color, onGo, say){
  const b = document.createElement("button");
  b.className = "chip"; b.style.background = color;
  b.innerHTML = '<span class="ic" aria-hidden="true">'+icon+'</span><span class="nm">'+label+
                '</span><span class="ct">'+count+' cards</span>';
  // Three visual lines concatenate into ONE run, so without this the chip
  // announces its icon, its name and its count as one word — the same class as
  // the fort's difficulty chips and its level cards, whose two lines ran
  // together in exactly this way. The count is the SAME number the chip PRINTS,
  // so the spoken label can never drift from what is on the screen.
  // A letter-team chip PRINTS the team in the icon slot, and an icon slot is
  // aria-hidden — so without `say` the one thing the chip is about would be the
  // one thing it never announced ("like duck, 15 cards").
  b.setAttribute("aria-label", (say || label) + ", " + count + " cards");
  b.addEventListener("click", onGo);
  host.appendChild(b);
  return b;
}

];
