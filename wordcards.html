<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Cards</title>
<style>
  :root{ --ground:#1B1035; --ink:#21123F; --card:#FFC93C; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* iOS touch hygiene — the same page-wide rule styles/main.css carries, which
     this standalone page does not load. `touch-action` INTERSECTS down the
     ancestor chain, so declaring it once on the root stops the ACCIDENTAL
     double-tap zoom everywhere (reported from real play) while leaving panning
     AND pinch-zoom alone — never `user-scalable=no`, which bans zooming.
     `overscroll-behavior` is the other half: it stops the rubber-band bounce and
     pull-to-refresh, which on a flash-card deck RELOADS the page and loses your
     place. Honest floor: Safari added it in 16, so Josh's iOS 14.2 iPad ignores
     it — it is the whole fix everywhere else and regresses nothing there. */
  html,body{height:100%;margin:0;
    touch-action:manipulation;overscroll-behavior:none;-webkit-overflow-scrolling:touch;}
  body{
    background:var(--ground);
    font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Nunito,Verdana,system-ui,sans-serif;
    display:flex;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .wrap{width:100%;max-width:560px;height:100%;min-height:100vh;min-height:100dvh;
        padding:calc(env(safe-area-inset-top, 0px) + 18px)
                calc(env(safe-area-inset-right, 0px) + 18px)
                calc(env(safe-area-inset-bottom, 0px) + 26px)
                calc(env(safe-area-inset-left, 0px) + 18px);
        display:grid;grid-template-columns:minmax(0,100%);gap:16px;}
  #deck{grid-template-rows:auto auto 1fr auto;}
  #menu{grid-auto-rows:min-content;align-content:start;}
  .hidden{display:none !important;}

  /* ---------- menu ---------- */
  #menu{overflow-y:auto;overscroll-behavior:contain;}
  .title{color:#fff;font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:.01em;}
  .sub{color:rgba(255,255,255,.5);font-size:16px;font-weight:600;margin-bottom:18px;}
  .all{
    /* 76px, not the 70px this shipped at: RULE 5 wants >= 75px for little
       hands, and nothing audited the MENU's taps — only the deck's. */
    width:100%;min-height:76px;border:0;border-radius:26px;background:#fff;color:var(--ink);
    padding:22px;font-family:inherit;font-size:23px;font-weight:800;cursor:pointer;
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
    box-shadow:0 10px 0 rgba(0,0,0,.22);margin-bottom:20px;
  }
  .all small{font-size:16px;font-weight:700;opacity:.5;}
  .all:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(0,0,0,.22);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:20px;}
  .chip{
    border:0;border-radius:22px;padding:16px 14px;cursor:pointer;font-family:inherit;
    color:var(--ink);text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.22);
    display:grid;grid-template-columns:minmax(0,100%);gap:4px;
  }
  .chip .ic{font-size:30px;line-height:1;}
  .chip .nm{font-size:18px;font-weight:800;line-height:1.15;}
  .chip .ct{font-size:14px;font-weight:700;opacity:.55;}
  .chip:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.22);}
  .chip:focus-visible,.all:focus-visible{outline:4px solid #fff;outline-offset:3px;}

  .mhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;}
  .home{
    width:76px;height:76px;border:0;border-radius:99px;background:rgba(255,255,255,.13);
    color:#fff;font-size:32px;line-height:1;text-decoration:none;
    display:grid;place-items:center;
  }
  .home:active{transform:scale(.92);}
  .home:focus-visible{outline:4px solid #fff;outline-offset:3px;}

  /* ---------- deck ---------- */
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;}
  .back{
    min-width:0;min-height:76px;border:0;border-radius:99px;background:rgba(255,255,255,.13);
    color:#fff;font-family:inherit;font-size:16px;font-weight:800;padding:11px 18px;
    cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .back:active{transform:scale(.97);}
  .icon{width:76px;height:76px;border:0;border-radius:99px;
    background:rgba(255,255,255,.13);color:#fff;font-size:19px;cursor:pointer;line-height:1;
    font-family:inherit;}
  .icon:active{transform:scale(.92);}
  /* the sound toggle is a STATE, so it reads as on at a glance, not just in
     its label — off by default (RULE 5) and remembered between visits. */
  .icon.on{background:#FFC93C;color:#21123F;}
  .back:focus-visible,.icon:focus-visible,.nav button:focus-visible{outline:3px solid #fff;outline-offset:3px;}

  .meter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;}
  .track{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;}
  .fill{height:100%;width:1%;border-radius:99px;background:var(--card);
        transition:width .35s cubic-bezier(.2,.8,.25,1),background .35s ease;}
  .count{color:rgba(255,255,255,.55);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}

  .scene{flex:1;min-height:230px;perspective:1400px;}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;
        transition:transform .5s cubic-bezier(.2,.85,.25,1);
        cursor:pointer;border:0;padding:0;background:none;display:block;}
  .card.flipped{transform:rotateY(180deg);}
  .card:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:34px;}
  .face{position:absolute;top:0;right:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        border-radius:34px;background:var(--card);overflow:hidden;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        box-shadow:0 16px 0 rgba(0,0,0,.22);transition:background .35s ease;}
  .back-face{transform:rotateY(180deg);}
  .word{font-size:64px;font-weight:800;color:var(--ink);letter-spacing:.02em;line-height:1;white-space:nowrap;}
  .hint{position:absolute;bottom:24px;color:rgba(33,18,63,.42);font-size:15px;font-weight:700;}
  .pic{font-size:clamp(3.6rem,22vmin,8rem);line-height:1;}
  .pic.sentence{font-size:clamp(1.5rem,7vmin,2.6rem);font-weight:800;color:var(--ink);
                line-height:1.35;max-width:82%;text-align:center;}
  .letters{margin-top:20px;display:flex;justify-content:center;font-size:26px;font-weight:800;
           color:rgba(33,18,63,.7);white-space:nowrap;}
  .letters span{padding:0 .22em;}
  /* a two-letter SOUND is one tile, not two letters: sh-i-p, never s-h-i-p.
     Spacing is a child margin, never a flex `gap` — Safari 14 drops gap in a
     flex row and every tile would touch on Josh's iPad. */
  .letters span.team{background:rgba(33,18,63,.14);border-radius:.3em;
                     padding:0 .16em;margin:0 .06em;}
  /* the shared ending in the families deck. An underline rather than a colour:
     the card background cycles through eight hues and a second ink colour
     could not stay above AA contrast on all of them. */
  .word .rime{border-bottom:.09em solid rgba(33,18,63,.45);padding-bottom:.02em;}
  .sect{color:rgba(255,255,255,.62);font-size:14px;font-weight:800;
        letter-spacing:.12em;text-transform:uppercase;margin:2px 0 12px;}
  .pop{animation:pop .32s cubic-bezier(.2,.9,.3,1);}
  @keyframes pop{from{transform:scale(.9) translateY(10px);opacity:.3}to{transform:none;opacity:1}}

  .nav{display:grid;grid-template-columns:auto auto;justify-content:center;gap:22px;}
  .nav button{width:76px;height:76px;border-radius:99px;border:3px solid rgba(255,255,255,.28);
    background:transparent;color:#fff;font-size:33px;line-height:1;padding-bottom:5px;cursor:pointer;
    transition:transform .12s ease,background .2s ease;}
  .nav button:active{transform:scale(.9);background:rgba(255,255,255,.12);}
  .nav button:disabled{opacity:.25;}

  @media (prefers-reduced-motion:reduce){ .card,.fill,.face{transition:none;} .pop{animation:none;} }
</style>
</head>
<body>

<div class="wrap hidden" id="deck">
  <div class="bar">
    <button class="back" id="back">&lsaquo;&nbsp; All words</button>
    <button class="icon" id="sound" aria-pressed="false" aria-label="Say each word out loud">&#128263;</button>
    <button class="icon" id="shuffle" aria-label="Shuffle these cards">&#128256;</button>
  </div>
  <div class="meter">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">1 / 500</span>
  </div>
  <div class="scene">
    <button class="card" id="card" aria-label="Flip the card">
      <div class="face"><div class="word" id="word">cat</div><div class="hint">tap me</div></div>
      <div class="face back-face"><div class="pic" id="pic">&#128049;</div><div class="letters" id="letters"></div></div>
    </button>
  </div>
  <div class="nav">
    <button id="prev" aria-label="Card before">&lsaquo;</button>
    <button id="next" aria-label="Next card">&rsaquo;</button>
  </div>
</div>

<div class="wrap" id="menu">
  <div class="mhead">
    <a class="home" href="./#home" aria-label="Back to Josh's Games">&#127968;</a>
    <div>
      <div class="title">Word Cards</div>
      <div class="sub">Read the word, then tap to see it.</div>
    </div>
  </div>
  <!-- Every count on this page is COUNTED from the data. A literal is a claim
       that goes stale the moment a card is added or removed. -->
  <h2 class="sect">Learning to read</h2>
  <div class="grid" id="readGrid"></div>
  <h2 class="sect">Words and pictures</h2>
  <button class="all" id="allBtn">Every word <small></small></button>
  <div class="grid" id="grid"></div>
</div>

const CATS  = [{"key":"animals","label":"Animals","icon":"🐶","color":"#FF9F1C"},{"key":"food","label":"Food","icon":"🍎","color":"#FF6B57"},{"key":"colors","label":"Colors","icon":"🎨","color":"#A46BFF"},{"key":"numbers","label":"Numbers","icon":"🔢","color":"#3FBFEF"},{"key":"body","label":"My Body","icon":"✋","color":"#FF7BB0"},{"key":"home","label":"At Home","icon":"🏠","color":"#2EC4A6"},{"key":"nature","label":"Outside","icon":"🌳","color":"#57C64A"},{"key":"vehicles","label":"Things That Go","icon":"🚗","color":"#FFC93C"},{"key":"verbs","label":"Doing Words","icon":"🏃","color":"#FF6B57"},{"key":"describe","label":"Describing Words","icon":"🌈","color":"#3FBFEF"},{"key":"people","label":"People","icon":"👩‍🏫","color":"#A46BFF"},{"key":"clothes","label":"Clothes","icon":"👕","color":"#FF7BB0"},{"key":"play","label":"Play & School","icon":"🧸","color":"#57C64A"},{"key":"magic","label":"Make Believe","icon":"🦄","color":"#FF9F1C"}];
const FAMILIES = [["at",["cat","bat","rat","hat"]],["an",["van","can","pan"]],["ap",["cap","map","clap"]],["ag",["bag","flag"]],["ad",["sad","dad"]],["am",["ram","ham"]],["ug",["bug","mug","hug"]],["un",["sun","run","fun"]],["ut",["nut","hut"]],["og",["dog","frog","log"]],["ed",["red","bed","sled"]],["en",["hen","pen","ten"]],["ell",["bell","shell"]],["all",["ball","wall"]],["ock",["rock","clock","sock","lock","peacock"]],["uck",["duck","truck"]],["ick",["chick","sick"]],["ing",["sing","ring"]],["ake",["cake","snake"]],["ar",["car","star"]],["one",["bone","phone"]],["oat",["goat","boat","coat"]],["ain",["rain","train","chain","brain"]],["oon",["moon","spoon","balloon"]],["ook",["book","hook","cook"]],["eep",["sheep","sleep"]],["ear",["bear","pear"]],["ee",["bee","tree","three"]]];
const PAIRS = [["mom","dad"],["grandma","grandpa"],["boy","girl"],["hot","cold"],["sun","moon"],["cat","dog"],["black","white"],["first","second"],["second","third"],["first","third"],["day","night"],["sad","happy"],["stop","go"],["prince","princess"],["zero","one"],["one","two"],["two","three"],["three","four"],["four","five"],["five","six"],["six","seven"],["seven","eight"],["eight","nine"],["nine","ten"]];
const COLORS = ["#FFC93C","#FF6B57","#3FBFEF","#57C64A","#FF7BB0","#FF9F1C","#2EC4A6","#A46BFF"];

/* ---------- sounds, not letters ----------
   "ship" is THREE sounds (sh-i-p) and the strip used to show four. That is
   wrong on 67 words, on exactly the skill Josh is working on. An algorithm
   alone is not safe, so each rule carries a verified exception list: "ng" is
   one sound in sing and ring and is plain n+g in penguin, kangaroo, mango,
   orange, finger, sponge and flamingo. A doubled consonant is always one. */
const SOUND_RULES = [
  ["tch", []],
  ["igh", ["eight"]],                 // eight is ei-gh, not igh
  ["sh", []], ["ch", []], ["th", []], ["ck", []], ["ph", []], ["wh", []],
  ["qu", []],
  ["ng", ["penguin","kangaroo","mango","orange","finger","sponge","flamingo"]],
  ["ee", []], ["oo", []],
  ["oa", ["koala"]],                  // koala is k-o-a-la across a syllable
  ["ay", []],
];
const DOUBLE = /^(bb|cc|dd|ff|gg|ll|mm|nn|pp|rr|ss|tt|zz)/;
function sounds(word){
  const w = String(word), out = [];
  let i = 0;
  outer: while (i < w.length){
    const rest = w.slice(i).toLowerCase();
    for (const r of SOUND_RULES){
      if (rest.startsWith(r[0]) && r[1].indexOf(w.toLowerCase()) < 0){
        out.push(w.substr(i, r[0].length)); i += r[0].length; continue outer;
      }
    }
    if (DOUBLE.test(rest)){ out.push(w.substr(i, 2)); i += 2; continue; }
    out.push(w[i]); i += 1;
  }
  return out;
}

/* ---------- a deck order he cannot guess ----------
   Every category used to be sorted short -> long (animals ran 3 to 8 letters),
   numbers ran zero..ten in counting order, and opposites sat back to back
   (wet/dry, old/new, fast/slow, mom/dad). All three let him predict the next
   card instead of reading it. The order below is SEEDED, so it is the same
   every time and a grown-up can track where he got to, and it is repaired so
   no two neighbours share a picture or make a guessable pair. */
function seedOf(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rngFrom(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const PAIRSET = {};
for (const p of PAIRS){ PAIRSET[p[0]+"|"+p[1]]=1; PAIRSET[p[1]+"|"+p[0]]=1; }
function clash(a,b){
  if (!a || !b) return false;
  if (a[2] !== "sight" && b[2] !== "sight" && a[1] === b[1]) return true;
  return !!PAIRSET[a[0]+"|"+b[0]];
}
function teachingOrder(list, seedText){
  const out = list.slice(), r = rngFrom(seedOf(seedText));
  for (let k=out.length-1;k>0;k--){ const j=Math.floor(r()*(k+1)); const t=out[k]; out[k]=out[j]; out[j]=t; }
  for (let k=1;k<out.length;k++){
    if (!clash(out[k-1], out[k])) continue;
    for (let j=k+1;j<out.length;j++){
      const t=out[k]; out[k]=out[j]; out[j]=t;
      if (!clash(out[k-1],out[k]) && !clash(out[j-1],out[j]) && (j+1>=out.length || !clash(out[j],out[j+1]))) break;
      out[j]=out[k]; out[k]=t;
    }
  }
  return out;
}

/* ---------- the reading decks, derived from the cards themselves ---------- */
// Letter-CVC is not the same as SOUND-CVC, and this deck's promise is that you
// can sound the word out. A final w, y or r is not a consonant here — it marks
// a vowel team or an r-controlled vowel, so cow, key, boy, saw and car are not
// blendable: a child sounding out k-e-y gets nothing. They stay in the picture
// decks, where the word is not being decoded.
const CVC = /^[bcdfghjklmnpqrstvwxyz][aeiou][bcdfghjklmnpqstvxz]$/;
const byWord = {}; for (const w of WORDS) byWord[w[0]] = w;
function firstWords(){ return WORDS.filter(w => w[2] !== "sight" && CVC.test(w[0])); }
function familyDeck(){
  const out = [];
  for (const f of FAMILIES) for (const w of f[1]) if (byWord[w]) out.push(byWord[w]);
  return out;
}
// …and a deck that teaches the ch SOUND must not hand him counter-examples:
// anchor's ch is /k/ and parachute's is /sh/, so a child applying exactly the
// rule this deck is for would sound both of them out wrong.
const NOT_A_TEAM = ["anchor","parachute"];
function teamDeck(){
  const out = [];
  for (const t of ["sh","ch","th"])
    for (const w of WORDS)
      if (w[2] !== "sight" && w[0].indexOf(t) >= 0 &&
          NOT_A_TEAM.indexOf(w[0]) < 0 && out.indexOf(w) < 0) out.push(w);
  return out;
}
function rimeOf(word){
  for (const f of FAMILIES) if (f[1].indexOf(word) >= 0) return f[0];
  return "";
}

/* ---------- say it out loud ----------
   He reads the front, flips, and HEARS the word confirm it — control of error
   with no grown-up needed. Off by default (RULE 5), one obvious toggle, and
   only ever spoken from inside a tap, which is what iOS requires. */
let soundOn = false;
try { soundOn = localStorage.getItem("wc-sound") === "1"; } catch (e) {}
function speak(text){
  try {
    if (!soundOn || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.75; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const $ = id => document.getElementById(id);
const menu=$("menu"), deckEl=$("deck"), card=$("card"), wordEl=$("word"), picEl=$("pic"),
      lettersEl=$("letters"), countEl=$("count"), fillEl=$("fill"),
      prevBtn=$("prev"), nextBtn=$("next"), backBtn=$("back"), soundBtn=$("sound");

let deck = [], i = 0, deckKind = "";

/* ---------- remember where he got to ----------
   The order is seeded so it is the SAME every time, which is only worth
   anything if you can carry on from where you stopped: a five-minute session
   is about twenty cards, and restarting at card 1 every time means the back
   of a 503-card deck is never reached. Shuffling clears it, since a shuffled
   deck has no "where you were". Storage can throw in private mode, so every
   read and write is guarded and the deck simply starts at the beginning. */
function atKey(){ return "wc-at-" + deckKind; }
function loadAt(n){
  try {
    const v = parseInt(localStorage.getItem(atKey()), 10);
    return (v >= 0 && v < n - 1) ? v : 0;   // finishing wraps back to the start
  } catch (e) { return 0; }
}
function saveAt(){ try { localStorage.setItem(atKey(), String(i)); } catch (e) {} }

/* ---------- menu ---------- */
function chip(host, icon, label, count, color, onGo){
  const b = document.createElement("button");
  b.className = "chip"; b.style.background = color;
  b.innerHTML = '<span class="ic">'+icon+'</span><span class="nm">'+label+
                '</span><span class="ct">'+count+' cards</span>';
  b.addEventListener("click", onGo);
  host.appendChild(b);
}
const READING = [
  ["🔤","First Words", "#2EC4A6", firstWords,  "first",  "shuffle"],
  ["🎵","Word Families","#FFC93C", familyDeck, "family", "grouped"],
  ["🔊","Sound Teams", "#FF7BB0", teamDeck,    "team",   "grouped"],
  ["📖","Sight Words", "#A46BFF", () => WORDS.filter(w => w[2]==="sight"), "sight", "shuffle"],
];
for (const r of READING){
  const list = r[3]();
  chip($("readGrid"), r[0], r[1], list.length, r[2], () => start(list, r[1], r[4], r[5]));
}
for (const c of CATS){
  const list = WORDS.filter(w => w[2] === c.key);
  chip($("grid"), c.icon, c.label, list.length, c.color, () => start(list, c.label, c.key, "shuffle"));
}
$("allBtn").querySelector("small").textContent = WORDS.length + " cards";
$("allBtn").addEventListener("click", () => start(WORDS.slice(), "All words", "all", "shuffle"));

function start(list, name, kind, mode){
  // A picture deck is SHUFFLED so it cannot be guessed. The two teaching decks
  // are GROUPED on purpose: cat-bat-hat next to each other is the whole lesson.
  deck = mode === "grouped" ? list.slice() : teachingOrder(list, name);
  deckKind = kind; i = loadAt(deck.length);
  backBtn.innerHTML = "&lsaquo;&nbsp; " + name;
  menu.classList.add("hidden");
  deckEl.classList.remove("hidden");
  unflipInstantly();
  render(true);
}
backBtn.addEventListener("click", () => {
  deckEl.classList.add("hidden");
  menu.classList.remove("hidden");
  try { speechSynthesis.cancel(); } catch (e) {}
});

/* ---------- cards ---------- */
function fit(el, startPx, minPx){
  const avail = card.clientWidth - 44;
  if (!avail) return;
  let size = startPx;
  el.style.fontSize = size + "px";
  let guard = 0;
  while (el.scrollWidth > avail && size > minPx && guard++ < 90){
    size -= 3; el.style.fontSize = size + "px";
  }
}

function render(animate){
  const word = deck[i][0], backText = deck[i][1], cat = deck[i][2];

  // In the families deck the shared ending is underlined: seeing -at in cat,
  // bat, rat and hat is exactly how the pattern is taught.
  wordEl.textContent = "";
  const rime = deckKind === "family" ? rimeOf(word) : "";
  if (rime && word.slice(-rime.length) === rime){
    wordEl.appendChild(document.createTextNode(word.slice(0, -rime.length)));
    const b = document.createElement("span");
    b.className = "rime"; b.textContent = rime;
    wordEl.appendChild(b);
  } else {
    wordEl.textContent = word;
  }

  const isSentence = cat === "sight";
  picEl.classList.toggle("sentence", isSentence);
  picEl.textContent = backText;
  if (isSentence) picEl.style.fontSize = "";

  lettersEl.innerHTML = "";
  const parts = sounds(word);
  for (const p of parts){
    const s = document.createElement("span");
    if (p.length > 1) s.className = "team";
    s.textContent = p;
    lettersEl.appendChild(s);
  }

  fit(wordEl, Math.min(Math.round(card.clientHeight * 0.40), 132), 26);
  fit(lettersEl, 30, 13);

  document.documentElement.style.setProperty("--card", COLORS[i % COLORS.length]);
  countEl.textContent = (i + 1) + " / " + deck.length;
  fillEl.style.width = ((i + 1) / deck.length * 100) + "%";
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === deck.length - 1;

  if (animate){ wordEl.classList.remove("pop"); void wordEl.offsetWidth; wordEl.classList.add("pop"); }
}

function unflipInstantly(){
  card.style.transition = "none";
  card.classList.remove("flipped");
  void card.offsetWidth;
  card.style.transition = "";
}

function go(step){
  const n = i + step;
  if (n < 0 || n >= deck.length) return;
  i = n; saveAt(); unflipInstantly(); render(true);
}

card.addEventListener("click", () => {
  card.classList.toggle("flipped");
  if (card.classList.contains("flipped")) speak(deck[i][0]);
});
nextBtn.addEventListener("click", () => go(1));
prevBtn.addEventListener("click", () => go(-1));

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  try { localStorage.setItem("wc-sound", soundOn ? "1" : "0"); } catch (e) {}
  paintSound();
  if (soundOn) speak(deck.length ? deck[i][0] : "hello");
  else try { speechSynthesis.cancel(); } catch (e) {}
});
function paintSound(){
  soundBtn.innerHTML = soundOn ? "&#128266;" : "&#128263;";
  soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  soundBtn.classList.toggle("on", soundOn);
}
paintSound();

$("shuffle").addEventListener("click", () => {
  for (let k = deck.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    const t = deck[k]; deck[k] = deck[j]; deck[j] = t;
  }
  i = 0; saveAt(); unflipInstantly(); render(true);
});

document.addEventListener("keydown", e => {
  if (deckEl.classList.contains("hidden")) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft")  go(-1);
});

let startX = null;
deckEl.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
deckEl.addEventListener("touchend", e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
  startX = null;
}, {passive:true});

window.addEventListener("resize", () => { if (deck.length) render(false); });
</script>
