  <link rel="manifest" href="manifest.webmanifest?v=__BUILD__" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>" />
</head>
<body>
  <!-- ONE LIGHT for every picture in the app.
       Josh's SVG art shipped as FLAT fills — 371 lines of art.js, zero
       gradients — so a head, a cube and a balloon were all the same solid disc
       of colour. These three shading gradients give every drawing the same
       light the fort's canvas renderer uses (upper-LEFT, `LIGHT` in
       td-render.js), so the two worlds are lit alike.

       They live HERE, once, on purpose. `stickers.js` records the first
       attempt, which gave each sticker its OWN <defs><radialGradient id="bg">:
       SVG fragment ids resolve DOCUMENT-WIDE and the Sticker Book paints 200
       pictures into one page, so every url(#bg) collapsed onto the FIRST
       sticker's gradient. The escape is not "no gradients" — it is ONE shared
       definition that is ALPHA-ONLY (white -> transparent -> black), so sharing
       it across 240 differently-coloured pictures is correct by construction
       instead of a collapse, and the whole document pays for 3 gradient objects
       rather than 200. Deliberately NOT a <filter>: a filter on art rendered by
       the hundred is the documented WebKit rasterization cliff that once stalled
       CI for over an hour. Gradients composite; filters rasterize. -->
  <svg class="jart-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
    <!-- the light axis, matching td-render.js LIGHT = {x:-0.55, y:-0.84} -->
    <linearGradient id="jart-lit" x1="0.225" y1="0.08" x2="0.775" y2="0.92">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.60" stop-color="#000000" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="jart-dome" cx="0.33" cy="0.24" r="0.82">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.70" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <radialGradient id="jart-ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs></svg>

  <header class="topbar">
    <span class="brand">Josh's Games</span>
    <button id="sound-toggle" class="btn-round" type="button"
            aria-label="Sound is off. Tap to turn sound on." aria-pressed="false">🔇</button>
  </header>

  <main id="screens">
    <!-- The front door: the app opens here — three big tiles, one per world.
         No name gates: each tile navigates straight to its world. -->
    <section id="screen-start" class="screen start">
      <h1 class="start__title">Who's playing? 👇</h1>
      <div class="start-grid" role="list" aria-label="Choose your world">
        <button id="start-josh" class="start-tile start-tile--josh tap" type="button" role="listitem" aria-label="Josh's games">
          <span class="start-tile__art art-fill" aria-hidden="true"></span>
          <span class="start-tile__label">Josh's Games</span>
        </button>
        <button id="start-hl" class="start-tile start-tile--hl tap" type="button" role="listitem" aria-label="华丽的游戏">
          <span class="start-tile__icon" aria-hidden="true">👵🏻</span>
          <span class="start-tile__label">华丽的游戏</span>
        </button>
        <button id="start-td" class="start-tile start-tile--td tap" type="button" role="listitem" aria-label="Fort Josh: Toybox Defense">
          <span class="start-tile__icon" aria-hidden="true">🏰</span>
          <span class="start-tile__label">Fort Josh</span>
        </button>
      </div>
    </section>
    <!-- Josh's launcher: a grid of big game tiles (icons carry the meaning). -->
    <section id="screen-home" class="screen home" hidden>
      <div class="game__bar">
        <button id="home-door" class="btn-round game__home" type="button" aria-label="Back to the front door">🚪</button>
        <h1 class="game__title home__title">Pick a game! 👇</h1>
        <!-- Word Cards. The bar is a 3-column grid whose third column is already
             var(--tap) wide, so this fills a slot that was an empty spacer and
             costs no layout. A real <a> because it is a real navigation; it is
             same-origin, so PWA standalone never shows a URL bar for it, and
             sw.js precaches it so it works offline like the rest of the site. -->
        <a id="home-cards" class="btn-round game__home" href="wordcards.html?v=__BUILD__" aria-label="Word cards">&#127183;</a>
      </div>
      <div id="home-grid" class="home-grid" role="list" aria-label="Games"></div>
    </section>
    <!-- Game screens are injected here by scripts/main.js from the registry. -->
  </main>

  <!-- __BUILD__ is rewritten to the commit SHA at deploy time for cache-busting. -->
  <script src="scripts/content.js?v=__BUILD__" defer></script>
  <script src="scripts/logic.js?v=__BUILD__" defer></script>
